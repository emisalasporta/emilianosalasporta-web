# ============================================================
# Panel de administración (Sveltia CMS) — Emiliano Salas Porta
# Edita los mismos archivos Markdown del sitio.
# NO hace falta tocar esto salvo que sepas lo que hacés.
# ============================================================

# Backend para editar ONLINE (desde cualquier lado, incluso el celular).
backend:
  name: github
  repo: emisalasporta/emilianosalasporta-web
  branch: main
  # base_url = el "portero" (Worker de Cloudflare) que hace el login seguro.
  base_url: https://sveltia-cms-auth.emilianosalas85.workers.dev

# Para editar DESDE TU COMPU no se usa este backend:
# entrá con Chrome o Edge a /admin/ y tocá "Work with Local Repository".

# Dónde se guardan las imágenes y archivos que subas desde el panel.
media_folder: "public/uploads"
public_folder: "/uploads"

# Cómo se nombran los archivos que crea el panel.
# Sin esto, el título "¿Hielo o sauna...?" generaba un archivo con "¿" y tildes.
# Con esto salen limpios: solo letras sin acento, números y guiones.
slug:
  encoding: "ascii"        # nada de tildes ni caracteres raros
  clean_accents: true      # "recuperación" -> "recuperacion"
  sanitize_replacement: "-" # los espacios y signos se vuelven guiones

# Sin panel de vista previa (usamos la web real para verlo).
editor:
  preview: false

collections:
  # ---------- BLOG ----------
  - name: "blog"
    label: "Blog"
    label_singular: "Entrada"
    description: "Notas y artículos del blog."
    folder: "src/content/blog"
    create: true
    extension: "md"
    format: "yaml-frontmatter"
    # Nombre del archivo = año-mes-titulo-limpio (ej: 2026-07-hielo-o-sauna.md)
    slug: "{{year}}-{{month}}-{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "description", label: "Bajada (resumen corto)", widget: "text" }
      - { name: "date", label: "Fecha", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - name: "category"
        label: "Categoría"
        widget: "select"
        options:
          - { label: "Entrenamiento", value: "entrenamiento" }
          - { label: "Nutrición", value: "nutricion" }
          - { label: "Carreras", value: "carreras" }
          - { label: "Mentalidad", value: "mentalidad" }
          - { label: "Equipamiento", value: "equipamiento" }
      - { name: "tags", label: "Etiquetas", widget: "list", required: false }
      - { name: "cover", label: "Imagen de portada (opcional)", widget: "image", required: false }
      - { name: "updated", label: "Fecha de actualización (opcional)", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
      - { name: "draft", label: "Borrador (no se publica)", widget: "boolean", default: false, required: false }
      - { name: "body", label: "Contenido", widget: "markdown" }

  # ---------- RECURSOS ----------
  - name: "recursos"
    label: "Recursos"
    label_singular: "Recurso"
    description: "Materiales descargables (PDF, planillas, guías)."
    folder: "src/content/recursos"
    create: true
    extension: "md"
    format: "yaml-frontmatter"
    slug: "{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "description", label: "Descripción", widget: "text" }
      - { name: "date", label: "Fecha", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - name: "tipo"
        label: "Tipo"
        widget: "select"
        default: "pdf"
        options:
          - { label: "PDF", value: "pdf" }
          - { label: "Planilla", value: "planilla" }
          - { label: "Guía", value: "guia" }
          - { label: "Video", value: "video" }
      - { name: "archivo", label: "Archivo (PDF / planilla)", widget: "file", required: false }
      - { name: "tags", label: "Etiquetas", widget: "list", required: false }
      - { name: "draft", label: "Borrador (no se publica)", widget: "boolean", default: false, required: false }
      - { name: "body", label: "Notas (opcional)", widget: "markdown", required: false }
