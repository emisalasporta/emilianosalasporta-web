:root{--rojo:#9B0F00;--negro:#2B161B;--crema:#F5EFE6;--piedra:#453E3E;--papel:#8A8080;
--dorado:#9A7830;--olivo:#3D4A2A;--linea:#E4DCCE;--bg:#FFFDFA;--sh:0 1px 3px rgba(20,18,16,.07),0 6px 18px rgba(20,18,16,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:M,system-ui,sans-serif;background:var(--bg);color:var(--negro);
 font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:76px}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--linea)}
.hd{display:flex;align-items:center;gap:11px;padding:10px 0}
.hd img{width:38px;height:38px;object-fit:contain;border-radius:6px}
.hd .t{flex:1;min-width:0}
.hd .t b{display:block;font-family:P;font-weight:700;font-size:16px;line-height:1.15}
.hd .t span{display:block;font-family:B;font-size:10px;letter-spacing:.18em;color:var(--rojo)}

/* buscador */
.search{position:relative;margin:12px 0}
.search input{width:100%;padding:13px 40px 13px 42px;border:1.5px solid var(--linea);
 border-radius:12px;background:#fff;font-size:16px;outline:none}
.search input:focus{border-color:var(--rojo)}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);
 display:flex;color:var(--papel);pointer-events:none}
.search .ic svg{width:19px;height:19px}
.search .cl{position:absolute;right:8px;top:50%;transform:translateY(-50%);
 width:28px;height:28px;border-radius:50%;color:var(--papel);font-size:18px;display:none}
.search.has .cl{display:block}

/* chips de filtro */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 12px;margin:0 -16px;
 scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;border:1px solid var(--linea);
 background:#fff;font-size:13px;color:var(--piedra);font-weight:600}
.chip.on{background:var(--negro);border-color:var(--negro);color:#fff}
.chip.g-novillo.on,.chip.g-cerdo.on{background:var(--rojo);border-color:var(--rojo)}

/* tarjetas */
.cards{display:grid;gap:10px;padding-bottom:14px}
.card{display:flex;gap:12px;background:#fff;border:1px solid var(--linea);border-radius:14px;
 padding:11px;box-shadow:var(--sh);text-align:left;width:100%;align-items:center}
.card:active{transform:scale(.99)}
.card img{width:78px;height:70px;object-fit:contain;border-radius:9px;background:#fff;
 border:1px solid var(--linea);padding:2px;flex:0 0 auto}
.card .b{flex:1;min-width:0}
.card .b h3{margin:0;font-family:P;font-weight:700;font-size:16.5px;line-height:1.2}
.card .b p{margin:3px 0 6px;font-size:12.5px;color:var(--piedra);line-height:1.4;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tg{display:flex;gap:5px;flex-wrap:wrap}
.tg span{font-family:B;font-size:10px;letter-spacing:.1em;padding:2px 7px;border-radius:4px;
 background:var(--crema);color:var(--piedra)}
.tg span.c-lenta{background:#F3E6E4;color:var(--rojo)}
.tg span.c-media{background:#F6EEDD;color:#8A6A21}
.tg span.c-rapida{background:#E9EDE2;color:var(--olivo)}

/* ficha */
#detail{position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto;
 transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
 -webkit-overflow-scrolling:touch}
#detail.open{transform:none}
.dbar{position:sticky;top:0;z-index:5;background:var(--bg);
 border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:8px;padding:9px 16px}
.dbar b{font-family:P;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{font-size:22px;color:var(--rojo);width:34px;height:34px;display:flex;align-items:center}
.hero{text-align:center;padding:14px 0 6px}
.hero img{width:min(66%,240px);margin:0 auto;background:var(--crema);border-radius:16px;padding:8px}
.kick{font-family:B;font-size:11px;letter-spacing:.24em;color:var(--rojo);margin-top:12px}
h1.dt{font-family:P;font-weight:700;font-size:27px;line-height:1.1;margin:3px 0 9px}
.frase{font-family:P;font-style:italic;font-size:17px;line-height:1.38;color:var(--rojo);margin:0 0 10px}
.res{font-size:14px;color:var(--piedra);line-height:1.6;margin:0 0 16px}

/* semáforo */
.sem{display:grid;gap:8px;margin:0 0 18px}
.sem .c{border-radius:12px;overflow:hidden;border:1px solid var(--linea);background:#fff}
.sem .h{font-family:B;font-size:12px;letter-spacing:.18em;color:#fff;padding:7px 12px;
 display:flex;align-items:center;gap:7px}
.sem .verde .h{background:var(--olivo)}.sem .ambar .h{background:var(--dorado)}
.sem .rojo .h{background:var(--rojo)}
.sem ul{margin:0;padding:8px 12px 10px 27px;font-size:13.5px;color:var(--piedra)}
.sem li{margin:3px 0}

/* acordeón */
.acc{border:1px solid var(--linea);border-radius:12px;background:#fff;margin-bottom:8px;overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:9px;padding:13px 14px;text-align:left}
.acc>button .n{font-family:B;font-size:12.5px;letter-spacing:.16em;flex:1}
.acc>button .ar{color:var(--rojo);font-size:13px;transition:transform .2s}
.acc.open>button .ar{transform:rotate(90deg)}
.acc .bd{padding:0 14px 14px;display:none;font-size:14px}
.acc.open .bd{display:block}
.acc .bd>*:first-child{margin-top:0}

ul.dot{margin:0 0 10px;padding-left:17px}
ul.dot li{margin:4px 0}
ul.dot li::marker{color:var(--rojo)}
.callout{background:var(--crema);border-left:3px solid var(--rojo);border-radius:0 8px 8px 0;
 padding:10px 12px;margin:10px 0;font-size:13.5px;line-height:1.55}
.callout.gold{border-left-color:var(--dorado)}
.callout.quote{font-family:P;font-style:italic;font-size:15px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--linea);
 border:1px solid var(--linea);border-radius:10px;overflow:hidden;margin:0 0 12px}
.kv div{background:#fff;padding:8px 10px}
.kv .k{font-family:B;font-size:10.5px;letter-spacing:.14em;color:var(--rojo)}
.kv .v{font-size:12.5px;line-height:1.35;margin-top:2px}
.nm{border:1px solid var(--linea);background:#FCFAF6;border-radius:10px;padding:11px 12px;margin-bottom:10px}
.nm .r{display:flex;gap:9px;font-size:13px;margin:4px 0}
.nm .r .k{font-family:B;font-size:10.5px;letter-spacing:.12em;color:var(--rojo);flex:0 0 78px;padding-top:2px}
.nm .nota{margin-top:8px;padding-top:8px;border-top:1px solid var(--linea);font-size:12.5px;color:var(--piedra)}
.frases{list-style:none;margin:0 0 10px;padding:0}
.frases li{font-family:P;font-style:italic;font-size:14.5px;border-left:2px solid var(--dorado);
 padding:2px 0 2px 11px;margin:8px 0;line-height:1.4}
.ideas{display:grid;gap:9px}
.idea{border-top:2px solid var(--dorado);padding-top:7px}
.idea b{display:block;font-family:P;font-size:14.5px}
.idea span{font-size:13px;color:var(--piedra)}
.mini{font-size:13px;color:var(--piedra)}
.mini b{color:var(--negro)}

/* decidir */
h2.sc{font-family:P;font-weight:700;font-size:23px;margin:18px 0 4px;line-height:1.15}
.sub{font-family:B;font-size:11px;letter-spacing:.2em;color:var(--rojo);margin-bottom:12px}
.qbtns{display:grid;gap:9px;margin-bottom:14px}
.qbtn{background:#fff;border:1.5px solid var(--linea);border-radius:13px;padding:14px;
 text-align:left;box-shadow:var(--sh)}
.qbtn.on{border-color:var(--rojo);background:#FCF6F4}
.qbtn b{display:block;font-size:15.5px}
.qbtn span{font-size:12.5px;color:var(--piedra)}
.res-list{display:grid;gap:8px;margin-bottom:16px}
.perfil{background:#fff;border:1px solid var(--linea);border-top:3px solid var(--rojo);
 border-radius:12px;padding:13px;margin-bottom:10px;box-shadow:var(--sh)}
.perfil h4{font-family:P;font-weight:700;font-size:17px;margin:0}
.perfil .s{font-size:12.5px;color:var(--papel);font-style:italic;margin:2px 0 9px}
.pill{display:inline-block;background:var(--crema);border:1px solid var(--linea);border-radius:7px;
 padding:4px 9px;font-size:12.5px;margin:0 5px 5px 0}
.perfil .cl{font-size:13px;color:var(--rojo);font-weight:600;margin-top:5px}
.errbox{display:flex;gap:11px;background:#fff;border:1px solid var(--linea);border-radius:12px;
 padding:12px;margin-bottom:9px}
.errbox .n{font-family:B;font-size:22px;color:var(--rojo);line-height:1}
.errbox h4{margin:0 0 3px;font-size:14.5px}
.errbox p{margin:0;font-size:13px;color:var(--piedra)}

/* tablas */
.tw{overflow-x:auto;margin:0 -16px 16px;padding:0 16px}
table{border-collapse:collapse;font-size:12.5px;min-width:100%;background:#fff}
th{background:var(--rojo);color:#fff;font-family:B;font-size:11px;letter-spacing:.12em;
 text-align:left;padding:8px 10px;font-weight:400;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--linea);vertical-align:top;min-width:96px}
tr:nth-child(even) td{background:#FCFAF6}
table.dark th{background:var(--negro)}

/* glosario */
.gitem{border-bottom:1px solid var(--linea);padding:9px 0;font-size:14px}
.gitem b{color:var(--negro)}
.gitem span{color:var(--piedra)}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);
 border-top:1px solid var(--linea);box-shadow:0 -6px 18px rgba(20,18,16,.05);
 padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:760px;margin:0 auto}
nav.tabs button{flex:1;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;
 gap:3px;color:var(--papel)}
nav.tabs button .i{display:flex;line-height:1}
nav.tabs button .i svg{width:21px;height:21px}
nav.tabs button .l{font-family:B;font-size:10px;letter-spacing:.13em}
nav.tabs button.on{color:var(--rojo)}
.empty{text-align:center;padding:40px 20px;color:var(--papel);font-size:14px}
.foot{text-align:center;padding:26px 16px 34px;color:var(--papel);font-size:11.5px;line-height:1.7}
.foot b{display:block;font-family:B;letter-spacing:.18em;color:var(--rojo);font-size:11px}

/* ══ tipografía de La Tradición: Poppins títulos + Lato texto ══ */
body{font-family:M,system-ui,sans-serif;font-size:16px;line-height:1.62;letter-spacing:0}
h1,h2,h3,h4,.hd .t b,.card .b h3,.dbar b,h1.dt,h2.sc,.perfil h4,.idea b,.errbox h4,.metodo h4{
  font-family:P,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em}
.hd .t b{font-size:17px}
.card .b h3{font-size:18px;line-height:1.25}
.card .b p{font-size:14px;line-height:1.45;color:var(--piedra)}
h1.dt{font-size:29px;font-weight:700;line-height:1.15}
h2.sc{font-size:24px;font-weight:700}
.dbar b{font-size:16px}
.perfil h4{font-size:18px}
.idea b{font-size:15.5px}
.errbox h4{font-size:15.5px}
/* etiquetas: Poppins semibold, sin el tracking exagerado */
.hd .t span,.sub,.kick,.tg span,.sem .h,.kv .k,.nm .r .k,nav.tabs button .l,th,.acc>button .n{
  font-family:P,system-ui,sans-serif;font-weight:600;text-transform:uppercase}
.hd .t span{font-size:10.5px;letter-spacing:.1em}
.sub{font-size:11.5px;letter-spacing:.08em}
.kick{font-size:11.5px;letter-spacing:.12em}
.tg span{font-size:10.5px;letter-spacing:.04em;padding:3px 8px;border-radius:5px}
.sem .h{font-size:12.5px;letter-spacing:.07em;padding:9px 13px}
.sem ul{font-size:15px;line-height:1.5;padding:10px 13px 12px 30px}
.sem li{margin:5px 0}
.kv .k{font-size:11px;letter-spacing:.05em}
.kv .v{font-size:14px;line-height:1.4}
.nm .r{font-size:14.5px}
.nm .r .k{font-size:11px;letter-spacing:.04em;flex:0 0 84px}
.nm .nota{font-size:13.5px;line-height:1.55}
nav.tabs button .l{font-size:10.5px;letter-spacing:.05em}
th{font-size:11.5px;letter-spacing:.04em}
.acc>button .n{font-size:13px;letter-spacing:.05em}
.errbox .n,.metodo .lt{font-family:P,system-ui,sans-serif;font-weight:700}
/* cursivas en Lato (mucho más legibles que una didona) */
.frase,.frases li,.callout.quote,.perfil .s{font-family:M,system-ui,sans-serif}
.frase{font-size:18px;line-height:1.45;font-weight:700;font-style:normal;color:var(--rojo)}
.frases li{font-size:15.5px;line-height:1.5}
.callout.quote{font-size:16px}
.res{font-size:15.5px;line-height:1.62}
.callout{font-size:15px;line-height:1.6;padding:12px 14px}
ul.dot{font-size:15.5px}
ul.dot li{margin:6px 0}
.mini{font-size:14.5px;line-height:1.6}
.acc .bd{font-size:15.5px}
.gitem{font-size:15px;line-height:1.6;padding:11px 0}
.chip{font-size:14px;padding:9px 15px}
.pill{font-size:14px;padding:6px 11px}
.qbtn b{font-size:17px;font-family:P;font-weight:600}
.qbtn span{font-size:14px}
.perfil .cl{font-size:14.5px}
.errbox p{font-size:14.5px;line-height:1.6}
td{font-size:13.5px;padding:10px 11px}
/* celular primero: objetivos táctiles y aire */
.card{padding:13px;gap:13px;border-radius:16px}
.card img{width:86px;height:78px}
.acc>button{padding:15px 15px;min-height:52px}
nav.tabs button{padding:10px 2px 12px;min-height:58px}
.search input{padding:15px 42px 15px 44px;font-size:16px;border-radius:14px}
.back{width:40px;height:40px;font-size:24px}
.dbar{padding:11px 16px}
body{padding-bottom:84px}
@media(max-width:400px){
  .card img{width:74px;height:70px}
  .card .b h3{font-size:17px}
  h1.dt{font-size:26px}
}

@media(min-width:620px){
 .sem{grid-template-columns:1fr 1fr 1fr}
 .ideas{grid-template-columns:1fr 1fr 1fr}
 .kv{grid-template-columns:1fr 1fr 1fr}
 .cards{grid-template-columns:1fr 1fr}
}

<script>
const D = {"meta": {"titulo": "Guía práctica y técnica", "subtitulo": "de cortes de carne", "bajada": "Métodos de cocción recomendados y desaconsejados, ideas de preparación y asesoramiento de venta", "marca": "La Tradición Carnicerías", "pie_portada": "Material interno de capacitación", "lugar": "Catamarca, Argentina", "edicion": "Edición 2026 · Versión 2", "autor": "Emiliano Salas Porta", "programa": "Programa Cortes & Sentires"}, "fichas": [{"slug": "picada-especial", "num": "6.1", "nombre": "Picada Especial", "grupo": "novillo", "frase": "No es un corte: es una preparación de carnicería. Práctica, rendidora y con menos grasa que la común.", "resumen": "La picada especial no sale de una parte del animal: es una mezcla de cortes seleccionados y procesados en picadora. Su valor está en la practicidad y en el rendimiento, no en la terneza ni en la categoría. Es el producto que más se usa en la comida diaria de una familia y, por eso mismo, el que más conviene tener estandarizado entre sucursales.", "semaforo": {"si": ["Empanadas", "Pastel de papa", "Albóndigas", "Salsa con carne / tuco", "Rellenos", "Hamburguesas caseras bien cocidas"], "criterio": ["Salteados desgranados", "Milanesa de carne picada, si se liga bien"], "no": ["Parrilla tradicional", "Bifes o milanesas", "Punto rojo o jugoso en el centro"]}, "nombres": {"oficial": "No corresponde: no es un corte anatómico.", "mostrador": "Picada especial.", "tambien": ["Picada magra", "Picada de primera (según la zona)"], "nota": "Sirve para entender que no es un corte uniforme, para diferenciarla de la picada común y para poder explicar por qué cambia según quién la prepare."}, "ubicacion": {"texto": "No tiene una única ubicación. Proviene de distintas partes del animal según cómo se arme la mezcla: recortes de desposte, cortes magros como cuadrada, bola de lomo o paleta, y en algunos casos un agregado controlado de grasa.", "implica": ["Variabilidad de textura entre lotes.", "Variabilidad de grasa según la selección.", "Resultados distintos si cada sucursal la arma a su criterio."], "clave": "No existe una sola «picada especial» universal. La define quien la hace."}, "datos": {"Terneza": "Media (está procesada)", "Fibra": "No visible", "Grasa": "Moderada, equilibrada", "Colágeno": "Variable", "Hueso": "No", "Rendimiento": "Alto"}, "comportamiento": {"bullets": ["Al perder la estructura de corte entero, funciona en preparaciones donde va desgranada, compactada o mezclada.", "Si se sobrecocina se seca: la grasa se pierde y queda arenosa.", "Si no se liga bien (huevo, pan, cebolla), las preparaciones compactadas se rompen."], "critico": "La calidad no depende del nombre: depende de la selección de carne que se usó."}, "recomendados": {"lista": ["Sartén y plancha (desgranada)", "Horno: pastel de papa, rellenos", "Albóndigas en salsa", "Empanadas", "Salsa boloñesa o tuco", "Hamburguesas caseras bien cocidas"], "claves": ["Cocción completa, sin partes rosadas: 71 °C en el centro.", "No pasarla de fuego una vez que perdió el color rojo.", "Ligar bien lo que se compacta."], "nota": "Al estar picada tiene más riesgo microbiológico que un trozo entero. La recomendación oficial es cocción completa. Esto se avisa siempre."}, "desaconsejados": {"lista": ["Parrilla tradicional", "Bifes o milanesas", "Plancha «vuelta y vuelta»", "Hamburguesa jugosa en punto rojo"], "porque": ["No es un corte entero: no tiene estructura para sostenerse.", "En punto rojo hay riesgo sanitario real, no una cuestión de gusto."], "error": "Sobrecocinar hasta secarla, o venderla como si fuera «para todo»."}, "venta": {"frases": ["«Es una picada con menos grasa que la común, más pareja y más rendidora.»", "«Va muy bien para empanadas, pastel de papa, albóndigas o hamburguesas caseras.»", "«No es un corte del animal: es una preparación nuestra, pensada para cocinar cómodo y rendir.»", "«Si querés algo práctico para toda la semana, es la mejor opción.»", "«Es una buena opción si querés algo rápido y económico: rinde y la usás para muchas comidas distintas.»", "«Si está bien hecha tiene buen equilibrio entre carne y grasa, no queda seca.»", "«Eso sí: va bien cocida, sin rosado adentro. Sobre todo si comen chicos.»"], "argumento": "Resuelve rápido, rinde bien y da menos margen de error que una picada demasiado grasa. Es el producto de la comida diaria.", "alternativa": "Si el cliente busca sabor por sobre prolijidad, ofrecer picada común. Si busca calidad de hamburguesería, explicar que eso es otro producto."}, "ideas": [["Empanadas de carne", "Se cocina pareja, se saltea rápido y no larga tanta grasa como la común."], ["Pastel de papa", "Rinde, la textura queda uniforme y no deja exceso de grasa en la fuente."], ["Albóndigas en salsa", "Con pan remojado y huevo para ligar. Se terminan de cocinar dentro de la salsa."]], "errores": ["Decir que es un corte específico del animal. No lo es.", "Prometer que no tiene grasa. Tiene menos que la común, no cero.", "Venderla como carne de alta calidad: se pone mal la expectativa.", "Recomendarla para cocción incompleta o punto jugoso.", "No aclarar la diferencia con la picada común: ahí la venta pierde valor.", "No estandarizarla dentro de la cadena. Si una sucursal la hace magra y otra grasosa, el nombre deja de significar algo."], "tags": {"coccion": "rapida", "metodos": ["horno", "sarten", "picada"], "perfiles": ["apurado", "economico"]}, "tabla": {"coccion": "Rápida / media", "terneza": "Media", "para": "Empanadas, pastel de papa, albóndigas, hamburguesas", "evitar": "Parrilla, bifes, punto rojo", "frase": "Práctica, rendidora y fácil de usar"}, "puntofino": "", "img": "data:image/webp;base64,UklGRvBGAABXRUJQVlA4IORGAADQJgGdASquAVgBPpVEm0glpCKhL9WpCLASiU3cLpHAAy6eCYB7K/y/8P+KvvSc3+X0cS7o6Uy/7Lvo//q/qI89zzS/uT6wHqJ/wXpK9UjvVH9kyZ1iHeL+Q/Ov7L+4/5b3CvuvBX6l/WeYX88/HXo/0B/a/xP/Ov3f0C/zv+6+aa926w/n+gjBJfBuV/+6/L4f1/Pv6rH/L52P0I11wcNStm+L3N8Xub4vc3xe5vi9zfF7m+L3N8Xub4vc3xe5vi8WaIQ+5VOkEpRfC45m/dV/tviAXs1aRiJ2kySPU5HmpyPKAWk6Jv8HjEBtj36BTzYnGZ tacular bien cocido. No se vende por terneza: se vende por sabor.", "resumen": "Corte con hueso que sale de la pata del animal, cortado en rodajas transversales, con carne, colágeno y el caracú en el centro. Es económico, muy sabroso y está pensado para cocciones largas, donde el colágeno se transforma y le da al plato una textura y una profundidad que no da ningún otro corte de este precio.", "semaforo": {"si": ["Puchero", "Guiso", "Estofado", "Braseado", "Horno largo con líquido"], "criterio": ["Osobuco al vino con sellado previo", "Olla a presión (acorta tiempos, pero cuidar el punto)"], "no": ["Plancha", "Sartén rápida", "Parrilla directa", "Cualquier cocción corta"]}, "nombres": {"oficial": "Garrón / Brazuelo (Ossobuco), cód. 1014 de la Resolución SENASA 1128/1999.", "mostrador": "Puchero caracú. Osobuco.", "tambien": ["Osobuco de novillo", "Garrón con hueso (menos preciso)", "Caracú (en Santa Fe se usa así)"], "nota": "«Caracú» es el tuétano, la médula del hueso, no el corte. El nombre de mostrador viene de ahí: lo que se está vendiendo es, en buena medida, ese hueso."}, "ubicacion": {"texto": "Sale de la parte baja de las patas, delanteras o traseras, aserrada en rodajas transversales. Cada rodaja lleva músculo de mucho trabajo, hueso central y médula ósea.", "implica": ["Es un corte duro en crudo.", "Tiene mucho colágeno.", "Necesita cocción larga, sí o sí.", "Bien cocido queda tierno y gelatinoso."], "clave": "Las rodajas del trasero son más carnosas que las del delantero. Las del delantero tienen más tejido conectivo y son todavía más económicas: para puchero rinden igual o mejor."}, "datos": {"Terneza": "Baja en crudo, alta bien cocido", "Fibra": "Gruesa y firme", "Grasa": "Baja a moderada", "Colágeno": "Alto — es la clave del corte", "Hueso": "Central, con caracú", "Rendimiento": "Alto en sabor, medio en volumen"}, "comportamiento": {"bullets": ["El colágeno se transforma en gelatina y da una textura suave que ningún corte magro consigue.", "El caracú aporta grasa y profundidad de sabor al caldo.", "La carne se vuelve desmenuzable si se cocina el tiempo suficiente.", "Hay un punto intermedio, más o menos a la hora, en el que está peor que al principio: contraído y seco. Ahí es donde mucha gente abandona. Hay que pasar de largo ese punto."], "critico": "Mal cocido: duro, fibroso y seco. Bien cocido: tierno, jugoso y potente en sabor. No hay término medio."}, "recomendados": {"lista": ["Olla — puchero tradicional", "Guiso", "Estofado", "Braseado", "Horno largo con líquido"], "claves": ["Tiempo prolongado: dos horas y media o tres, según el tamaño de la rodaja.", "Temperatura moderada, que apenas burbujee.", "Presencia de líquido: es fundamental, no opcional."], "nota": "Es un corte de cocción lenta por definición: en olla común no hay atajos, y conviene decirlo de frente. La olla a presión acorta los tiempos, pero hay que controlar el punto."}, "desaconsejados": {"lista": ["Plancha", "Sartén rápida", "Parrilla directa", "Cocciones cortas"], "porque": ["No llega a romperse el colágeno.", "La fibra queda dura.", "El resultado es seco y difícil de comer."], "error": "Querer hacerlo rápido. Arruina completamente el corte y el cliente no vuelve."}, "venta": {"frases": ["«No es un corte tierno de entrada, pero bien cocido queda espectacular.»", "«Es ideal para guiso o puchero porque tiene mucho sabor.»", "«El hueso con caracú le da un plus que no tiene cualquier corte.»", "«Es económico y rinde mucho, pero necesita sus dos horas y media. Si hoy no tenés tiempo, te doy otra cosa.»"], "argumento": "No se vende por terneza, se vende por sabor y resultado final. Es el corte perfecto para el cliente que busca algo económico pero sabroso.", "alternativa": "Si el cliente no tiene tiempo, ofrecer picada especial o un corte de plancha. Nunca venderle osobuco a alguien apurado."}, "ideas": [["Puchero clásico", "Agua, verduras de estación, tiempo. Resultado seguro y comida para dos días."], ["Osobuco al vino", "Sellado previo y cocción larga con líquido. Plato potente con poco costo."], ["Guiso cargado con legumbres", "Ideal para volumen y sabor profundo. Rinde para muchos."]], "errores": ["No aclarar que necesita tiempo: frustración asegurada.", "Venderlo como corte «rápido»: error grave.", "No explicar el valor del hueso: se percibe como desperdicio.", "No sugerir método de cocción: el cliente queda perdido.", "Compararlo con cortes tiernos: expectativa mal puesta."], "tags": {"coccion": "lenta", "metodos": ["olla", "horno"], "perfiles": ["contiempo", "economico"]}, "tabla": {"coccion": "Lenta", "terneza": "Baja en crudo / alta cocido", "para": "Guiso, puchero, estofado", "evitar": "Plancha, parrilla, apuro", "frase": "No es tierno de entrada, pero bien hecho es espectacular"}, "puntofino": "", "img": "data:image/webp;base64,UklGRsQ2AABXRUJQVlA4ILg2AABw9ACdASquAVgBPpVGnkolpCMhqDPrALASiWNu4XVQ2KOdb3HvuL+l/kfT05F8eAR3ar23pN3DXmb/cr1kfUn/ed+u3pbIXvPXlU8hcWXyn7d4OuP/tv1NfD/HzwX+fuoX7p8978TvQ+A8xT4Bj9VoX+R6hPkt/8vml1E1hIj2q2ttsQMBNSHnk77hyiJ+DZ5ta4D23V+pm03g8i9sF4aJNc+a48Fh8XAzMQzWz5/wwxKzHNzf3jMCQeVz8Gzza1wHuHJ76P6HDCLLrbY2Q9rE9U0IPUYYpX1kmaeW5goWDBPLzqNbtNwy0F6JoQQqPPtrgEPx+rXJ0xASDQeebWuA9w5RE+sm/QoNKmtQEUagr0VZ2FisYIl6RH0/l+du4Xi3TlyLYRdDYTljSlrLp/c0VKqP4uwtMhmWHxf13yI+JW52/6tRENA15d7ESg0iwCqW/Bs82tbvhGrldVT25AWu26U2BLwXKHb69R5ZPWHyP5T8pMZmMoVsVg4hbFYDp9RTDpfxCbZUQQjnJXLfjITYgxTv+03XENVSkFiT2q/hpA2JgnsxghEFWoWifqW/BsxFTYUGIsgQE2p0vuMZbFaKlmLWDdp5U1VDk2Ap8xIs+vo3YGKQ125N1h9zDh/+PFtc4/w4X+FAEuGXBI9O5yhrdBmCRIQPNrXAe4cbajhMphbwHX41/IfFDMa9rCMa6xi+E1cgSE2Cntd0yPelauVYJoxoaYv4mx2NnSfnqHwTT70jyTsEuQqM38OWnNnLMIWc3Krs1Non6lvwbPtjXgJY59gnYPEpPZEzZ5pBgO2nO7l+2iYNDuG9XmIyu51WQgpt/LSTPMsUwf31dD5T72zocC5ziOzHpqldiRwK0k7v61wHuHKImsGKXniiizikvGEvf4aPKSrFdMh4wV/AES2OYlHK1/DkN9OOlJNKAcMtpyFXWabreaL5cw9ksFiEz44IRMxZCB6rUk794wIjlxAKg37ZN2FKK93Pk0B+nb8GzSVpE7FdnUAv/o9W8NRfJODVp3g9G5D9xV1ZyvVV1gPg9Xj66VUWNUNLOJvWl6OCU5r5mgRK1Xb6fyMGwQRyNBbXIJ6vm1BXXzNqr9pHU+VLwnlcaf9If9pJXKRQ/EbXrNQbAl3GUmrAF8lMXkJYXnCT+mzCpmSP0X maforo": {"si": ["Caldo casero", "Puchero (combinado con otros cortes)", "Sopas", "Base de guisos"], "criterio": ["Como único corte de un puchero chico: rinde poco en carne"], "no": ["Parrilla", "Plancha", "Sartén", "Horno seco"]}, "nombres": {"oficial": "No tiene entrada propia en el nomenclador. Es el subproducto óseo del despiece de la aguja (cód. 2306).", "mostrador": "Puchero de aguja. Espinazo.", "tambien": ["Hueso de aguja", "Espinazo de novillo"], "nota": "La aguja, el roast beef y el espinazo salen del mismo bloque: el cuello y el dorso anterior. La aguja es el bloque con hueso, el roast beef es la carne deshuesada y el espinazo es el hueso que queda."}, "ubicacion": {"texto": "Vértebras cervicales y primeras dorsales, con los restos de carne que quedan entre las apófisis.", "implica": ["Predominio de hueso sobre carne.", "Poca masa muscular aprovechable.", "Colágeno presente en las articulaciones."], "clave": "No es un corte para comer carne. Es un corte para construir sabor."}, "datos": {"Terneza": "No aplica como criterio", "Fibra": "Escasa y dispersa", "Grasa": "Baja a moderada", "Colágeno": "Presente en articulaciones", "Hueso": "Predominante", "Rendimiento": "Bajo en carne, alto en sabor"}, "comportamiento": {"bullets": ["Libera sabor al caldo y le da cuerpo.", "El colágeno de las articulaciones aporta gelatina: el caldo se nota más espeso al enfriarse.", "La poca carne que trae se vuelve blanda con cocción prolongada."], "critico": "No se evalúa por cantidad de carne, sino por lo que aporta al conjunto."}, "recomendados": {"lista": ["Olla — puchero", "Caldo base", "Sopas", "Guisos, como complemento"], "claves": ["Cocción prolongada.", "Abundante líquido.", "Integración con otros ingredientes y otros cortes."], "nota": "Se usa como base o refuerzo, no como corte principal. Conviene venderlo acompañado."}, "desaconsejados": {"lista": ["Parrilla", "Plancha", "Sartén", "Horno seco"], "porque": ["No tiene estructura cárnica suficiente.", "Se seca rápidamente.", "Fuera de la cocción húmeda no aporta nada."], "error": "Tratarlo como si fuera un corte con carne aprovechable. El cliente se decepciona apenas abre el paquete."}, "venta": {"frases": ["«Esto es ideal para darle sabor al caldo o al puchero.»", "«No tiene mucha carne, pero hace toda la diferencia en el sabor.»", "«Si querés un buen puchero, esto suma mucho. Llevalo con un osobuco o una falda.»", "«Es económico y rinde en preparaciones grandes.»"], "argumento": "No se vende por lo que se ve, se vende por lo que aporta. Y es la venta cruzada más natural del mostrador: nunca va solo.", "alternativa": "Siempre ofrecerlo junto con osobuco, falda o bocado. Solo, decepciona."}, "ideas": [["Caldo casero", "Base para sopas, arroz o cualquier preparación. Se puede congelar en porciones."], ["Puchero combinado", "Aporta sabor al conjunto, sin protagonismo en el plato."], ["Fondo para guisos", "Se hace el caldo primero y después se arma el guiso con otro corte."]], "errores": ["No aclarar que tiene poca carne: cliente decepcionado.", "Venderlo como corte principal: error conceptual.", "No sugerir combinarlo con otros cortes: uso incompleto y venta más chica.", "No explicar su función: se subestima el producto.", "Compararlo con osobuco o falda: confusión total."], "tags": {"coccion": "lenta", "metodos": ["olla"], "perfiles": ["contiempo", "economico"]}, "tabla": {"coccion": "Lenta", "terneza": "No aplica", "para": "Caldos, base de sabor, puchero", "evitar": "Parrilla, plancha, horno seco", "frase": "No es por la carne, es por el sabor que aporta"}, "puntofino": "", "img": "data:image/webp;base64,UklGRvIvAABXRUJQVlA4IOYvAACQxQCdASquAVgBPpVGnkqlo6KhqRiY8LASiWVu4XVQ+e2H1hBHuf7fzHOTfBX7fwHlgvb/9v1x7hPzX+cd5y2/O71TkNnkvy8d/2JfoJ+W/vHor4e+0LUX+a/ojIGya+bP0v7B35v/XfOn/B7iXff+P6CnwbHMZA/mP4bdAnyYf+Lyo6iJHbaVjRIn1saEACIvHHQgARF446EACFlfv2uLZEXjjoQAIi8cdB/4UO7E/Lvy0vNatvF2zAA7UZX1yh1BSq6tMmMxkCq5HF8OZHc/2RbjJQBvx/WxoQAIi8cc5RgpFQoxwrHkg3p6Ug/+mX8iZaN9pInszcy+UrN9oh7GnvUZkP3B/6xEYf slug": "tapa-de-asado", "num": "6.4", "nombre": "Tapa de Asado", "grupo": "novillo", "frase": "Corte tramposo: parece simple y falla fácil. Con tiempo, es de los que mejor pagan.", "resumen": "Es la pieza que cubre la parte alta y delantera del costillar: la carne que queda sobre las primeras costillas una vez retirada la paleta. Tiene una combinación de carne, grasa y tejido conectivo que la hace sabrosa y rendidora, pero requiere criterio. Bien trabajada da un resultado muy bueno; mal usada queda dura o seca.", "semaforo": {"si": ["Parrilla a fuego medio o bajo, con tiempo", "Horno", "Braseado", "Arrollada y rellena", "Sellado previo y horno tapado", "Olla en preparaciones largas"], "criterio": ["Parrilla a fuego más fuerte, solo si se la controla de cerca", "Bifes, únicamente con cocción previa"], "no": ["Plancha rápida", "Sartén fuerte", "Parrilla muy fuerte sin control"]}, "nombres": {"oficial": "No figura en el nomenclador. Es nombre de carnicería.", "mostrador": "Tapa de asado.", "tambien": ["Pecho o pecho liso (Mendoza)", "Grano del pecho (Tucumán)"], "nota": "No confundir con el matambre, que es la capa fina y superficial que sí recubre toda la cara externa del costillar (en Córdoba lo llaman «manta»). Tampoco con el asado de tira ni con el asado sin hueso, que es el costillar deshuesado."}, "ubicacion": {"texto": "Cubre la parte alta y delantera del costillar, sobre las primeras costillas, en la zona que quedaba debajo de la paleta. Se vende separada o junto con el costillar.", "implica": ["Forma plana y alargada.", "Capas alternadas de carne, grasa y tejido conectivo.", "Comportamiento irregular: no todas las zonas responden igual al calor."], "clave": "No es un corte homogéneo. Tiene partes que se cocinan a distinta velocidad, y por eso pide fuego parejo y bajo."}, "datos": {"Terneza": "Media a baja, según el manejo", "Fibra": "Media, con partes más firmes", "Grasa": "Moderada, a veces superficial", "Colágeno": "Presente", "Hueso": "No", "Rendimiento": "Bueno si se cocina bien"}, "comportamiento": {"bullets": ["Necesita tiempo o técnica para ablandarse.", "La grasa aporta sabor, pero mal manejada queda pesada o quemada.", "Se seca si se cocina rápido y sin control.", "Con calor bajo y sostenido el tejido conectivo cede y el corte cambia por completo."], "critico": "Es un corte tramposo: parece simple, pero mal usado falla fácil. Nunca venderlo sin explicar cómo hacerlo."}, "recomendados": {"lista": ["Parrilla a fuego medio o bajo, con tiempo controlado", "Horno", "Sellado previo y cocción lenta", "Braseado", "Olla en preparaciones largas"], "claves": ["No apurar la cocción.", "Controlar temperatura: fuego parejo, no fuerte.", "Aprovechar su grasa sin quemarla: empezar del lado de la grasa."], "nota": "Funciona mejor cuando se le da tiempo o cuando se lo adapta: arrollados, rellenos, horno tapado."}, "desaconsejados": {"lista": ["Plancha rápida", "Sartén fuerte", "Parrilla muy fuerte sin control"], "porque": ["No se rompe el tejido conectivo.", "Queda dura o chiclosa.", "La grasa se quema antes de que la carne esté lista."], "error": "Tratarla como un bife rápido. Resultado mediocre o directamente malo."}, "venta": {"frases": ["«Tiene muy buen sabor, pero hay que cocinarla con tiempo.»", "«Para horno o parrilla tranquila funciona muy bien.»", "«Es una opción rendidora si sabés cómo hacerla. Fuego bajo y paciencia.»", "«No es para hacer rápido, pero el resultado vale la pena.»"], "argumento": "Se vende como corte sabroso y rendidor, no como corte tierno. Es la puerta de entrada del cliente parrillero que no quiere gastar en cortes caros.", "alternativa": "Si el cliente quiere parrilla rápida, ofrecer aguja parrillera o dulce de espalda."}, "ideas": [["Tapa de asado a la parrilla", "Fuego medio o bajo. Clásico: tiempo y paciencia, del lado de la grasa primero."], ["Al horno con vegetales", "Resultado seguro y fácil para el cliente que no domina la parrilla."], ["Arrollada y rellena", "Con verduras y huevo. Muy buena opción para vender más valor por pieza."]], "errores": ["Venderla como corte tierno: error grave.", "No aclarar que necesita tiempo: mala experiencia.", "Recomendarla para plancha: falla segura.", "No explicar cómo manejar la grasa: resultado pesado o quemado.", "Compararla con cortes premium: expectativa incorrecta.", "Confundirla con el matambre: son piezas distintas y se cocinan distinto."], "tags": {"coccion": "lenta", "metodos": ["parrilla", "horno", "olla"], "perfiles": ["contiempo", "parrillero", "economico"]}, "tabla": {"coccion": "Media / lenta", "terneza": "Media-baja", "para": "Parrilla tranquila, horno, arrollados", "evitar": "Plancha rápida, fuego fuerte", "frase": "Rinde y tiene sabor, pero hay que cocinarla con tiempo"}, "puntofino": "", "img": "data:image/webp;base64,UklGRvYeAABXRUJQVlA4IOoeAACQogCdASquAVgBPpVKoEslpKMhpxUo8LASiWVu4XaxA2MdaeUnaH+fxelp3FfO16djT5MunlHiX6zwVziOyR2P8AjFDsoBXsviXtzEv6XQ2/+fnNzzixSgXCfknd3d3d3d3d3d3d3d3d3d3d3d3d3dQ1nEmsJLFKBcJ+Sd0bF8c/iv//QcKmSrzPlGVvvsO/TeUVdPFRdvnLxsPFeCniRVOcSawksUoFwn1hltl1qkHfK3KaXRjUz1cFIUq4pt1TvbvOIdSMdyPxIHWnBzm3ev3rh5waGgSE+qRFFzrFoygXCfknd3d3dHCEzKhgUmxi0KBviUJ/nZOVWzMj3jduFKrVSw3vXO7vG5UrgkFIZbmJXFk3O4tG2Aoz/lkE1RhGRPviWsJLFKBcJ+SuNqZRDlx2qA4ongOP5aN4XcRKOziYBRRqduI4FXoYNh0XqgggcJi0FOKGbls2Zf8rxFYpQLhPyTu8JhloGg4MoslxfuOlo7DqemK6jNY4ahXMSzMJiPv+4l1M0s0X8VOWaHUBjmb5JqPKc0unQmdi2EKUGRc4k1hJYpQLoXRCgfUMCGsiX+/YqcfLFMCZH8p/bP0dUCsiY4Xux7+KZz8x+OZweaxgcYczCsVbJQ7/D06Kyg0ALi7u7u7u7u7ukBlr4qSl3RTJmWdkeJGL+o/C8XCUWFWA0up5eeUrLQPk8k5F+9onQIdsrCUqy2NDLJy8K1J5xY+XWalOmKUC4T8k7ukMNRpt5Y4Snx+/sPPeSgIt7cIkcMfYEND46C71JIUehNK9LzMVwqm+H52wZ+BoSmjDqdeKMGzaEG0A77cfG/VvFxCont6wksUoFwnKg7dqePIaqZUtZLJ5BsK9BusiDMllmGcD8WaF9+hnXbuK+FnQ72Ne4VKYhyrvZDVxFYCHdHsPEqudX3yLpsFhHUzjmHbPfdFQAsUoFwn5J7WV0owqUw/YAB+nF3imG+DUX0S+D7FGJ2zilhlvTGudAWAgYAnjq6IwEPmBSD8OfsT21tLL4A72rwhDxykPdDBC0Uwxr1ti84k1hJYpLCThtPplsd+fQ9s0/bh+ZD0g7rLCqzAKXuC1cJCjv3Xn0ky9VlZV3H0DnuuUd8FskPsPAw4xALrBPFXsmrmqlAJmEhkJzj4ZTisBds/JO7u7ujnWx5BEpWEqmXtqPf+zw ar encima", "Caldo, si es falda con hueso"], "no": ["Plancha", "Sartén", "Cocción rápida sin control"]}, "nombres": {"oficial": "Falda, cód. 2316.", "mostrador": "Falda. Se vende con hueso o deshuesada.", "tambien": ["Falsa entraña (Tucumán)", "Keperí (en algunas zonas del norte)"], "nota": "No confundir con el vacío, que es abdominal y no tiene hueso, ni con el matambre, que es la capa superficial que va por encima de los dos."}, "ubicacion": {"texto": "Está en el área inferior y posterior de la región torácica: donde termina el pecho y empieza el abdomen. La versión con hueso conserva la última esternebra y los cartílagos de las costillas 7 a 10.", "implica": ["Forma fina y alargada.", "Presencia de huesos chicos y cartílagos en la versión con hueso.", "Fibras largas y marcadas."], "clave": "Es un corte de estructura irregular: tiene zonas que se cocinan a distinta velocidad. Los cartílagos son justamente lo que le da cuerpo al caldo."}, "datos": {"Terneza": "Media — puede quedar tierna o dura según cocción", "Fibra": "Marcada y larga", "Grasa": "Moderada", "Colágeno": "Presente", "Hueso": "Sí en la versión con hueso: fino y distribuido", "Rendimiento": "Bueno en sabor, medio en volumen"}, "comportamiento": {"bullets": ["Cocida lento se vuelve muy tierna y el cartílago se gelatiniza.", "En parrilla, con fuego bajo y paciencia, da un resultado muy bueno.", "Cocida rápido o a fuego fuerte, queda dura o gomosa.", "Cortada a favor de la fibra, se hace difícil de masticar: siempre en contra de la fibra."], "critico": "Es un corte de decisión: o parrilla con fuego bajo y paciencia, o olla con tiempo. El punto intermedio —fuego medio y apurado— es el peor de todos."}, "recomendados": {"lista": ["Olla — puchero", "Guiso", "Estofado", "Parrilla a fuego bajo, con tiempo", "Horno"], "claves": ["En parrilla: no apurar, pero tampoco dejarla olvidada.", "En olla: tiempo y humedad.", "Aprovechar su grasa para dar sabor.", "Cortarla siempre en contra de la fibra."], "nota": "Funciona tanto en parrilla como en olla, pero con manejo completamente distinto. Hay que preguntar cuál de las dos va a hacer el cliente antes de aconsejar."}, "desaconsejados": {"lista": ["Plancha", "Sartén", "Cocción rápida sin control"], "porque": ["La fibra no llega a ablandarse.", "Queda dura o gomosa.", "No desarrolla su potencial de sabor."], "error": "Querer hacerla como un bife. Mala decisión y reclamo casi seguro."}, "venta": {"frases": ["«Tiene mucho sabor, es ideal para parrilla tranquila o para guiso.»", "«No es el corte más tierno, pero bien hecho queda muy bien.»", "«Es rendidor y económico.»", "«Si la cocinás con tiempo, mejora muchísimo. Y cortala siempre en contra de la fibra.»"], "argumento": "Se vende como corte sabroso y rendidor, no como corte premium. Es el mejor aliado del cliente que quiere gastar poco y comer bien.", "alternativa": "Si el cliente quiere algo rápido, ofrecer un corte de plancha. Si quiere puchero con más carne, ofrecer osobuco."}, "ideas": [["Falda al puchero", "Clásico, resultado seguro. Con hueso rinde más en sabor."], ["Falda a la parrilla a fuego bajo", "Bien hecha queda muy buena, pero requiere paciencia y fuego parejo."], ["Guiso con falda", "Cocción larga donde se ablanda por completo. Rinde para muchos."]], "errores": ["No aclarar cómo cocinarla: resultado irregular.", "Venderla como corte tierno: expectativa mal puesta.", "Recomendarla para plancha: falla segura.", "No advertir sobre la fibra ni cómo cortarla: cliente sorprendido.", "No aclarar si lleva hueso: confusión en el rendimiento y en el precio."], "tags": {"coccion": "lenta", "metodos": ["olla", "parrilla", "horno"], "perfiles": ["contiempo", "parrillero", "economico"]}, "tabla": {"coccion": "Media / lenta", "terneza": "Media", "para": "Puchero, guiso, parrilla a fuego bajo", "evitar": "Plancha, sartén, apuro", "frase": "Mucho sabor, pero hay que saber hacerla"}, "puntofino": "", "img": "data:image/webp;base64,UklGRsYmAABXRUJQVlA4ILomAABQqACdASquAVgBPpVKoEqlpKM bres": {"oficial": "Aguja, cód. 2306.", "mostrador": "Aguja parrillera. Aguja especial.", "tambien": ["Roast beef (es la aguja deshuesada)", "Sobaco (Salta)", "Entrecote (Mendoza)", "Primo (Tucumán)"], "nota": "El roast beef no es un corte distinto de la aguja: es la misma carne, sin hueso. Con hueso se vende como aguja y se fetea en bifes de aguja; deshuesada se vende como roast beef. Del mismo bloque sale también el espinazo."}, "ubicacion": {"texto": "Parte anterior de la región dorsal y cervical, entre el cogote adelante y el bife ancho atrás. Forma parte del cuarto delantero.", "implica": ["Mayor trabajo muscular, por lo tanto menos terneza natural.", "Buena infiltración de grasa.", "Presencia de tejido conectivo entre los músculos."], "clave": "Es un corte con más sabor que terneza. Necesita criterio para sacarle el potencial."}, "datos": {"Terneza": "Media a baja, mejora con cocción adecuada", "Fibra": "Marcada", "Grasa": "Moderada a buena — es la clave del corte", "Colágeno": "Presente", "Hueso": "Sí en la versión con hueso", "Rendimiento": "Bueno"}, "comportamiento": {"bullets": ["La grasa infiltrada aporta jugosidad y perdona algún error de fuego.", "Con fuego medio y tiempo queda tierno dentro de su lógica.", "Si se apura, la fibra se contrae y queda duro.", "Los nervios internos entre músculos no desaparecen: conviene limpiarlos o cortar alrededor."], "critico": "No es duro porque sí. Es duro cuando se lo cocina mal."}, "recomendados": {"lista": ["Parrilla — uso principal", "Horno", "Braseado", "Olla en preparaciones largas"], "claves": ["Fuego medio, nunca fuerte.", "Tiempo controlado: no es un corte de quince minutos.", "No apurar la cocción."], "nota": "Es ideal para el cliente que quiere parrilla sin irse a los cortes caros. Y es también la base de una picada casera excelente cortada a cuchillo."}, "desaconsejados": {"lista": ["Plancha rápida", "Sartén sin preparación previa", "Cocción apurada"], "porque": ["No llega a ablandarse.", "La fibra queda firme.", "Pierde jugosidad."], "error": "Tratarlo como si fuera un bife tierno de cuarto trasero."}, "venta": {"frases": ["«Tiene mucho sabor, es ideal para parrilla.»", "«No es el más tierno, pero bien hecho queda muy bien.»", "«Es una excelente opción si querés algo rico sin gastar tanto.»", "«Si lo hacés tranquilo en la parrilla, con fuego medio, responde muy bien.»"], "argumento": "Buen equilibrio entre precio, sabor y resultado. Es el corte que salva el asado del cliente que no quiere pagar cortes caros.", "alternativa": "Si lo quiere sin hueso, ofrecer roast beef, que es la misma carne deshuesada."}, "ideas": [["Aguja a la parrilla", "Uso principal. Fuego medio, sin apurar, dándola vuelta poco."], ["Aguja al horno con vegetales", "Alternativa más controlada para quien no domina el fuego."], ["Bifes de aguja a la plancha", "Corte grueso y bien manejado. Funciona, pero pide atención."]], "errores": ["Venderlo como corte tierno: expectativa errónea.", "No aclarar el tiempo de cocción: mala experiencia.", "Recomendarlo para plancha rápida: falla segura.", "No explicar su valor en sabor: se subestima y no rota.", "Compararlo con cortes premium del cuarto trasero: confusión y expectativa incorrecta.", "Decir que roast beef y aguja son cortes distintos: es la misma carne, con y sin hueso."], "tags": {"coccion": "media", "metodos": ["parrilla", "horno", "olla"], "perfiles": ["parrillero", "economico", "contiempo"]}, "tabla": {"coccion": "Media", "terneza": "Media-baja", "para": "Parrilla, horno, braseado", "evitar": "Plancha rápida, fuego fuerte", "frase": "Gran sabor sin pagar caro"}, "puntofino": "", "img": "data:image/webp;base64,UklGRixFAABXRUJQVlA4ICBFAABwIQGdASquAVgBPpVCnEilpCMhLDPreLASiWNu/HyZq9mSL6rel6Tfkny+jv4mPiWd/8T3q/+/61Ob16qPNB533m579tvUWQk+aPL34z/zvBXzFfdf4j0V8RfblqTeMeO/7PeM/zl1FPzX+yeaRBI6uUDfqnEV3XXrt4sH+P1EPJW8HX6T6jx06JJnoA7JXXfqoqSZ6AOyV136qKkmegDruu9DBp+a0h7JxZTw4XtWm6NMBZVWYsRhyA/9SgeHkg2w2DLvwjiByDjffpBx2F9KcFyPRKCrEi1qq6jwFHTv9dH+m17PgdkieXGNk8 quido"], "no": ["Plancha rápida", "Sartén", "Milanesa", "Fuego fuerte directo"]}, "nombres": {"oficial": "No figura como tal en el nomenclador. Corresponde a piezas de la paleta del cuarto delantero.", "mostrador": "Bocado ancho (con hueso) y bocado fino (sin hueso o con menos hueso).", "tambien": ["Paleta con hueso", "Carne de paleta para guiso"], "nota": "«Ancho» y «fino» no tienen una definición técnica uniforme: el criterio de despiece varía de carnicería en carnicería. Conviene que las nueve sucursales usen el mismo estándar, con foto y peso de referencia, para que el nombre signifique lo mismo en todas."}, "ubicacion": {"texto": "Cuarto delantero, en la zona de la paleta. Es una región de mucho trabajo muscular.", "implica": ["Fibras desarrolladas y con dirección marcada.", "Alto contenido de tejido conectivo.", "Menor terneza natural que cualquier corte del trasero."], "clave": "Es un corte de trabajo: necesita transformación. No responde a cocciones rápidas sin criterio."}, "datos": {"Terneza": "Baja en rápido, alta en lento bien hecho", "Fibra": "Gruesa y con dirección marcada", "Grasa": "Cobertura externa moderada, algo de infiltración", "Colágeno": "Alto — con calor húmedo se hace gelatina", "Hueso": "Sí en el bocado ancho", "Rendimiento": "Medio; mejora en preparaciones largas"}, "comportamiento": {"bullets": ["Cocido lento se vuelve tierno, jugoso y desmenuzable.", "Cocido rápido queda firme, duro o chicloso.", "El hueso aporta mucho sabor a la salsa, pero baja el rendimiento en carne.", "Igual que el osobuco, pasa por un punto intermedio en el que está peor que al principio. Hay que seguir."], "critico": "El colágeno solo se transforma con humedad y tiempo. Sin líquido no hay milagro."}, "recomendados": {"lista": ["Estofado", "Guiso", "Braseado", "Horno lento y tapado", "Olla"], "claves": ["Tiempo prolongado: dos a tres horas.", "Presencia de humedad.", "Temperatura moderada."], "nota": "Parrilla solo si es animal joven y a fuego bajo. No es su mejor uso y conviene aclararlo."}, "desaconsejados": {"lista": ["Plancha rápida", "Sartén", "Milanesa", "Fuego fuerte directo"], "porque": ["El colágeno no se transforma.", "Las fibras se contraen.", "Pierde jugosidad."], "error": "Venderlo para «algo rápido». El resultado es carne dura, seca y difícil de comer."}, "venta": {"frases": ["«Es un corte con mucho sabor, ideal para horno o guiso.»", "«No es para hacer rápido, pero bien cocido queda excelente.»", "«El hueso le aporta un sabor que no tienen otros cortes.»", "«Si querés algo rendidor y sabroso, es muy buena opción. Calculá dos horas y media.»"], "argumento": "Tiene sabor de hueso. Es el diferencial y hay que nombrarlo: ningún corte magro da eso.", "alternativa": "«Si querés algo parecido pero sin hueso, te doy bocado fino o roast beef.»"}, "ideas": [["Bocado al horno con papas", "Marinado con chimichurri, tapado, dos horas y media a fuego medio."], ["Estofado de invierno", "Cortado en cubos, con lentejas o arroz. El hueso le da cuerpo a la salsa."], ["Desmechado", "Braseado tres horas hasta que la carne se separe sola del hueso. Rinde para sándwiches."]], "errores": ["Venderlo como corte tierno para plancha: error grave.", "No aclarar que necesita tiempo: frustración.", "No advertir sobre el hueso: mala experiencia con el rendimiento.", "Confundirlo con aguja: son zonas distintas del delantero.", "No ofrecer la alternativa sin hueso: pérdida de venta.", "Que cada sucursal corte el ancho y el fino a su criterio: el nombre pierde sentido."], "tags": {"coccion": "lenta", "metodos": ["olla", "horno"], "perfiles": ["contiempo", "economico"]}, "tabla": {"coccion": "Lenta", "terneza": "Baja → alta", "para": "Guiso, horno, estofado, desmechado", "evitar": "Plancha, milanesa, apuro", "frase": "Sabroso y rendidor, pero necesita tiempo"}, "puntofino": "", "img": "data:image/webp;base64,UklGRp5CAABXRUJQVlA4IJJCAABw/ACdASquAVgBPpVCnEklo6KhLLj50LASiWNu4Xdg3V+9TnIft/+7/lfTg5D8To9eCD3Rm//Cd7b/retL9VdPf1G/2/7QPh752fqD/xfoq9UD6IHTS a de lomo y atrás con el peceto.", "implica": ["Músculo trabajado, de fibras firmes.", "Bajo contenido graso.", "Estructura compacta y pareja, ideal para fetear."], "clave": "Es un corte magro y estructural. No tiene grasa que lo salve en la cocción."}, "datos": {"Terneza": "Media — no es blanda de base", "Fibra": "Firme y compacta", "Grasa": "Muy baja", "Colágeno": "Bajo a moderado", "Hueso": "No", "Rendimiento": "Alto, con poca merma"}, "comportamiento": {"bullets": ["Bien trabajada responde muy bien: se fetea prolija y pareja.", "Se seca rápido si se pasa de cocción.", "No tiene margen de error: no hay grasa que compense.", "En milanesa el rebozado la protege y le aporta la humedad que le falta."], "critico": "Es un corte «seco» si no se maneja bien. Todo lo que se le agregue —rebozado, salsa, jugo— juega a favor."}, "recomendados": {"lista": ["Milanesas — uso principal", "Bifes finos con salsa o verduras", "Salteado en tiras", "Horno con acompañamiento húmedo"], "claves": ["Cortes finos.", "No sobrecocinar.", "Acompañar con grasa o humedad."], "nota": "Funciona mejor cuando se le agrega algo: rebozado, salsa, cebolla, jugos de cocción."}, "desaconsejados": {"lista": ["Bifes gruesos a la plancha", "Parrilla directa como corte principal", "Cocción prolongada sin humedad"], "porque": ["Se seca rápido.", "Queda dura.", "Pierde jugosidad y no la recupera."], "error": "Venderla como bife tierno. Es el clásico «me dijiste que era tiernísima»."}, "venta": {"frases": ["«Es ideal para milanesas: rinde mucho y sale prolija.»", "«Es magra, casi sin grasa. Justamente por eso no la pases de cocción.»", "«Para bifes puede ir, pero conviene finita y con alguna salsa o cebolla.»", "«Si la querés para un bife jugoso, hay otros cortes que te van a responder mejor.»"], "argumento": "Limpieza, rendimiento y practicidad. Es el corte de la milanesa de todos los días.", "alternativa": "Si busca jugosidad para plancha, ofrecer un corte con más grasa. Si busca economía en milanesa, ofrecer blando de paleta o tortuguita."}, "ideas": [["Milanesas de cuadrada", "Uso principal. Excelente resultado y muy buen rendimiento por kilo."], ["Bifes a la criolla", "Con tomate y cebolla, que le aportan la humedad que el corte no tiene."], ["Salteado en tiras", "Práctico y rendidor. Fuego fuerte, poco tiempo, en tandas chicas."]], "errores": ["Decir que es «tiernísima»: el error clásico.", "No advertir que es magra: cliente decepcionado.", "Recomendarla para parrilla: mala experiencia.", "No sugerir acompañamiento: queda seca.", "Confundirla con nalga de adentro o bola de lomo: son piezas distintas y con otro precio."], "tags": {"coccion": "rapida", "metodos": ["milanesa", "sarten", "horno"], "perfiles": ["apurado", "economico"]}, "tabla": {"coccion": "Rápida y controlada", "terneza": "Media", "para": "Milanesas, bifes finos, salteados", "evitar": "Parrilla, bifes gruesos", "frase": "Rinde mucho, es la reina de la milanesa"}, "puntofino": "", "img": "data:image/webp;base64,UklGRn4tAABXRUJQVlA4IHItAABQ0gCdASquAVgBPpVGnkmlpCMhKnVaCLASiWVu4XYA0+rP7TGZeF+1zuI3ADb2f/W9YfOK9Onmj85Tzl9+m9BrppshC8t+VHxYxZdUoV30RkX/Wu2H/hd+vAO9r+cJDG61lyswH6O/0+pr008On/H0NH/j5wNRkuacuAxXwTmqr4m0Ry2kMBhuHRZxYzRTXnB13t+rtvVOxrRozd+nDeWVJIna3WiAOXBuGZ8QwcmP/zjtE77ptNhuwx75CL58IhifbpHLRYX5hHAAxK9Lo2gj6iFgh5YXnmeQDUuNH6H7PfZGzPPKgfktmJ25rSD9WBy4NwzPf8NyUKr3uf29K40+Kq/fOjoU0dcm0NJqQwym4QoD7Qs7NHeDjESeAtuKB4/ah/7JNCHjqQLZnvtwKeG9aeKVmmo3LotiJAZefvdSIxapik8iq+Sqa0eG4Zncwd6oiPgugjYBtBoBpClJJPIoaurLisxWeMUDt8SWYCyLVLii1uaLOtXi3i+vFplNAN7fn5TlR1AhvnfQAxNEwSznUdio5v7pSFmwY8pDWce1rD7hvKiH6vxvi2j+RDQiimTdRt5pYNHemcIsZ2nBNjHpgvemdY/0D4P3zqDxKWgwKyo/otIKJMtSjTNo+DpEQ2Sl/Xwv1KzcJVWG0rvUh+gvrxaKSBh268WA2a6hcxN9OXAsro9bUbhmfD/zDXgJgeTs/zlUQ98gdntO8ExPm+drZiw86c9rgSLwFKAyjnmzolqwYYs29ncSyt0pX8K3WdrCMLxKZjZVpEH9HnHHKj4RYaITXrYtSFuSpZJficuDcMz5Oi1ylulPzi0jgFSVlFPCIVmlhxLfrBm3lST4XGRDOezTwUtxspfIb14fEGi0/RwWpQGzBXLkyMZecbWB7rYtK7l2EBjNAspWRsvI8kL646juo3DM+I6vn0TCjhA117CzjoDX/opZ6I0vJOhJqkeEAqtBzKVEKS60YGyRTyrCw n el cuadril.", "implica": ["Zona de trabajo, vinculada al movimiento: estructura compacta y firme.", "Bajo contenido de grasa.", "Fibras más firmes que en los cortes blandos del trasero."], "clave": "Es un corte de buena calidad comercial, pero no es blando porque sí. Si el cliente busca un bife tierno y jugoso sin demasiada vuelta, hay opciones mejores."}, "datos": {"Terneza": "Media a media-baja", "Fibra": "Compacta, firme y uniforme", "Grasa": "Muy baja", "Colágeno": "Bajo a moderado", "Hueso": "No", "Rendimiento": "Alto"}, "comportamiento": {"bullets": ["Es prolijo, con poca merma, y rinde bien para fetear o porcionar.", "Al ser magro, no tiene grasa suficiente para compensar errores.", "Cuando se pasa de cocción se seca, pierde jugosidad y se vuelve firme.", "En milanesa encuentra uno de sus mejores usos: el rebozado protege y aporta la percepción de terneza."], "critico": "Es un corte correcto y útil, pero con poco margen de error."}, "recomendados": {"lista": ["Milanesas", "Bifes finos, sobre todo con salsa o acompañamiento húmedo", "Salteado en tiras", "Horno con verduras, jugo o cobertura", "Cocciones breves y controladas"], "claves": ["Cortado fino se cocina rápido y sale bien.", "Con salsa, huevo, cebolla o verduras, mejora mucho el resultado.", "Nunca dejarlo solo frente al calor seco."], "nota": "Funciona mejor en preparaciones prácticas, cotidianas y controladas. Es carne de todos los días."}, "desaconsejados": {"lista": ["Bifes gruesos a la plancha", "Parrilla directa como corte principal", "Cocciones largas sin líquido"], "porque": ["El espesor juega en contra.", "Al no tener grasa, el calor fuerte o prolongado lo castiga rápido.", "Tratado como corte premium, decepciona."], "error": "Venderlo como ideal para «bife jugoso vuelta y vuelta». Se puede hacer bife, pero fino, bien cocido y con algo que sume humedad."}, "venta": {"frases": ["«Es un corte muy rendidor y prolijo, ideal para milanesas.»", "«Para bifes va mejor si los hacés finitos.»", "«Es magro, así que conviene no pasarlo de cocción.»", "«Si lo querés para algo jugoso, hay otros cortes que te van a responder mejor.»", "«Ojo que de lomo no tiene nada, es el nombre nomás.»"], "argumento": "Buena presentación, poco desperdicio, fácil de porcionar y útil para las comidas de todos los días. Se vende desde el rendimiento y la practicidad, no desde una terneza que no tiene.", "alternativa": "Si busca jugosidad, ofrecer un corte con grasa. Si busca milanesa económica, blando de paleta."}, "ideas": [["Milanesas de bola de lomo", "Muy buen rendimiento y feteado prolijo."], ["Bifes finos a la plancha", "Finos, sin pasarse, con cebolla o salsa."], ["Salteado en tiras", "Funciona muy bien por su estructura compacta."]], "errores": ["Decir que es un corte tierno sin aclaraciones.", "Venderlo para parrilla como si fuera una gran opción.", "Sugerirlo para bifes gruesos.", "No advertir que es magro.", "No orientar sobre cómo cocinarlo.", "Confundirlo con peceto, nalga o cuadrada."], "tags": {"coccion": "rapida", "metodos": ["milanesa", "sarten", "horno"], "perfiles": ["apurado", "economico"]}, "tabla": {"coccion": "Rápida y controlada", "terneza": "Media-baja", "para": "Milanesas, bifes finos, salteados", "evitar": "Parrilla, bifes gruesos", "frase": "Prolija y rendidora, pero no la pases de cocción"}, "puntofino": "El cliente ve un corte prolijo y asume que es blando. Si el vendedor repite esa idea sin explicar nada, después viene la queja.", "img": "data:image/webp;base64,UklGRvorAABXRUJQVlA4IO4rAACQ0QCdASquAVgBPpVGnUolpCKhqPPakLASiWVu7op0t8ADK/Ihh3tbV+T8k4RAdwx5rPO5cn7x5xZb3UkA4/8nJyO0/gL4kdurxXmU4AeKH7x/6NgvO3/+vnG+6ysRN1QW+ZeXg6oLfMvLwdUFvmXlzXUup/9LU+xiqremzrMhZe4wcw4i4lxNQ3WhYs4YfOmjqbqgt8y8vADVZHfuwYQSMp/5pmu5+2FyjzbRpbO0WfQhYVhFqQJyQpaaHzafgsEfHR8zD1YIsgw/XGU6o8mR2CBE7F+jeBSt8f1tLzai8lMCgwPO/1KFZiPNhDmpLWxF1EJEgFsm+lwaJbZSgOddFb8l+TyvGF7NIJJf48hXZjchiTLXYCx36Zc8A8t4r0lSnUH3f73LYbJfMOo4RmXy8HIrmwVZvBSf7O7EDeg/7dfaztBLeVAsZCvaMUvw6+CU2C8Zj3OY0y6VAbKNG3PRMgY8jd  compacto y de trabajo moderado.", "implica": ["Estructura firme y bastante uniforme.", "Forma pequeña y redondeada.", "Poca merma: sale limpio."], "clave": "No es un corte grande ni principal. Es un subcorte chico y específico, por eso no siempre hay."}, "datos": {"Terneza": "Media a baja", "Fibra": "Corta pero compacta", "Grasa": "Muy baja", "Colágeno": "Bajo a medio", "Hueso": "No", "Rendimiento": "Muy alto, casi sin desperdicio"}, "comportamiento": {"bullets": ["Es parejo y fácil de trabajar: sale una milanesa prolija.", "Al ser muy magro, se seca si se pasa de cocción.", "Puede ser un poco más firme que otros cortes de la pierna.", "En cocciones largas sin líquido se endurece en lugar de ablandarse."], "critico": "Es magro y parejo, pero no es blando. Vale la misma regla que la cuadrada: sin grasa no hay margen de error."}, "recomendados": {"lista": ["Milanesas", "Bifes finos a la plancha", "Carne en tiras", "Salteados"], "claves": ["Cortar fino y parejo.", "Cocción rápida y controlada.", "Acompañar con algo que aporte humedad si va en bife."], "nota": "Por el tamaño de la pieza, rinde muy bien en porciones chicas y en preparaciones para una o dos personas."}, "desaconsejados": {"lista": ["Cocciones largas", "Parrilla gruesa", "Sobrecocción"], "porque": ["Se seca.", "Se endurece en lugar de ablandarse.", "No tiene grasa que lo proteja del fuego directo."], "error": "Venderlo como corte tierno o mandarlo a la parrilla en pieza gruesa."}, "venta": {"frases": ["«Es un corte magro y rendidor, casi sin desperdicio.»", "«Va bien para milanesas o plancha.»", "«Es parejo, fácil de trabajar, sale prolijo.»", "«No es de los más tiernos, pero funciona bien si no lo pasás de cocción.»"], "argumento": "Rendimiento, practicidad y bajo desperdicio. Es ideal para compras chicas.", "alternativa": "Si quiere volumen para muchas milanesas, ofrecer cuadrada. Si quiere jugosidad, otro corte."}, "ideas": [["Milanesas", "Buen rendimiento y feteado parejo, ideal para porciones individ  o a la plancha. Es una opción equilibrada entre precio y calidad, superior a otros cortes delanteros si se cocina correctamente.", "semaforo": {"si": ["Parrilla a fuego medio", "Horno", "Plancha en cortes adecuados", "Preparaciones simples"], "criterio": ["Bifes gruesos, si se controla el punto", "Braseado corto"], "no": ["Fuego muy fuerte", "Cocciones muy cortas", "Venderlo sin limpiar los nervios"]}, "nombres": {"oficial": "No figura en el nomenclador. Es una denominación comercial regional.", "mostrador": "Dulce de espalda.", "tambien": [], "nota": "Es un nombre propio del mostrador, muy usado en la zona, sin equivalencia internacional consolidada. Conviene tener la referencia interna del despiece documentada con foto, para que las nueve sucursales corten la misma pieza."}, "ubicacion": {"texto": "Parte superior del delantero, en la transición entre la aguja y el lomo ancho. Es una zona menos exigida que la paleta y más estable que el cuello.", "implica": ["Mejor terneza que el resto de los cortes delanteros.", "Presencia moderada de grasa.", "Algo de tejido conectivo entre músculos."], "clave": "Es un punto intermedio interesante: tiene el sabor del delantero con bastante más terneza."}, "datos": {"Terneza": "Media a buena", "Fibra": "Intermedia", "Grasa": "Moderada", "Colágeno": "Presente, en poca cantidad", "Hueso": "No", "Rendimiento": "Bueno"}, "comportamiento": {"bullets": ["Responde muy bien a fuego medio y sostenido.", "A fuego muy fuerte se endurece: no perdona el apuro.", "En cocciones muy cortas no llega a desarrollar sabor ni textura.", "Los nervios que quedan sin limpiar afectan la textura final."], "critico": "Es de los delanteros que mejor resultado dan si se cocina bien. Pero sigue siendo delantero: hay que decirlo para que la expectativa sea la correcta."}, "recomendados": {"lista": ["Parrilla a fuego medio", "Horno", "Plancha en cortes adecuados", "Preparaciones simples"], "claves": ["Fuego medio, nunca fuerte.", "Limpiar bien la pieza antes de  agrega líquido"], "no": ["Fuego fuerte y apurado", "Guiso largo (pierde identidad)", "Punto rosado en el centro"]}, "nombres": {"oficial": "No figura en la nomenclatura oficial de cortes porcinos. En Argentina «vacío» designa un corte vacuno.", "mostrador": "Vacío de cerdo.", "tambien": ["Manta de cerdo", "Falda de cerdo (en algunos contextos, no es exacto)"], "nota": "Es una denominación comercial. Conviene mostrar la pieza al cliente que no la conoce, porque el nombre lo remite al vacío vacuno y el comportamiento no es el mismo."}, "ubicacion": {"texto": "Zona abdominal lateral del cerdo, por debajo del lomo y en la vecindad de la panceta y del matambre.", "implica": ["No es un músculo de altísima exigencia: la terneza es media.", "Tiene grasa externa, que le permite tolerar el calor directo.", "Es pared abdominal: trae más tejido conectivo del que aparenta."], "clave": "La grasa externa es el corazón del corte. Bien manejada, es lo que lo hace jugoso; mal manejada, es lo que lo arruina."}, "datos": {"Terneza": "Media", "Fibra": "Corta a media", "Grasa": "Externa, abundante — clave para el sabor", "Colágeno": "Moderado", "Hueso": "No", "Rendimiento": "Bueno si se limpia correctamente"}, "comportamiento": {"bullets": ["Empezando del lado de la grasa, esta se derrite y va bañando la carne: mejora muchísimo el resultado.", "A fuego fuerte la grasa se quema antes de que la carne esté lista.", "Si se cocina rápido y se pasa, se seca.", "En guiso largo se deshace y pierde la identidad que justifica su precio."], "critico": "No exige cocción larga como un corte de guiso, pero tampoco tolera fuego fuerte y apurado. Va tranquilo y sostenido."}, "recomendados": {"lista": ["Parrilla — uso principal", "Horno", "Plancha en porciones más chicas"], "claves": ["Fuego medio, nunca agresivo.", "Empezar siempre por el lado de la grasa.", "No sobrecocinar, pero llegar a 70 °C en el centro."], "nota": "Es el corte de parrilla de cerdo con mejor relación precio–resultado que tenemos." . Es visualmente atractivo, fácil de porcionar y muy versátil, pero tiene una contra importante: al ser magro, si se cocina mal se seca rápido. Es el típico corte que parece fácil… hasta que alguien lo pasa de cocción.", "semaforo": {"si": ["Plancha y sartén en costeletas", "Parrilla sin exceso de fuego", "Horno en pieza entera con líquido o relleno"], "criterio": ["Horno sin líquido, si se controla el punto con termómetro", "Bifes gruesos, sin pasarlos"], "no": ["Cocción prolongada sin líquido", "Fuego muy fuerte sin control", "Guisos o estofados largos"]}, "nombres": {"oficial": "Carré de cerdo. Es nomenclatura reconocida.", "mostrador": "Carré. Costeleta cuando se fetea con hueso.", "tambien": ["Lomo con hueso de cerdo", "Chuleta de cerdo"], "nota": "Lleva la porción dorsal de las costillas, la parte pegada al lomo. La porción baja del costillar, más grasa y con cartílago, es el pechito: son cortes distintos. Tampoco confundirlo con el lomo o solomillo, que es el músculo interno, mucho más chico y más tierno."}, "ubicacion": {"texto": "Parte superior del cerdo, a lo largo del lomo, incluyendo la porción dorsal de las costillas.", "implica": ["Músculo poco exigido: alta terneza natural.", "Bajo contenido de grasa: tendencia a secarse.", "Poco colágeno: no necesita ni tolera cocciones largas."], "clave": "Más magro que la bondiola, más tierno que el pechito y menos sabroso que los cortes con más grasa."}, "datos": {"Terneza": "Alta", "Fibra": "Corta y fina", "Grasa": "Baja — es el punto crítico", "Colágeno": "Bajo", "Hueso": "Sí, costillas dorsales", "Rendimiento": "Alto, casi sin desperdicio"}, "comportamiento": {"bullets": ["Responde muy bien a cocciones rápidas y controladas.", "Se seca fácilmente si se pasa: no tiene grasa que perdone errores.", "En pieza entera al horno, la marinada, el relleno o el líquido cambian por completo el resultado.", "El hueso ayuda a que la costeleta no se seque tanto como un bife deshuesado."], "critico": "Es un corte fácil de coci tamiento": {"bullets": ["Necesita tiempo o técnica para ablandarse.", "El colágeno bien trabajado mejora la textura y espesa la salsa.", "Cocido rápido queda duro.", "Cortado chico y salteado con tiempo suficiente, también funciona."], "critico": "Es un corte que no se cocina apurado. No hay atajo."}, "recomendados": {"lista": ["Guisos y estofados", "Horno en cocciones medias a largas", "Braseado", "Salteados largos, cortado chico"], "claves": ["Tiempo.", "Temperatura moderada.", "Presencia de líquido o humedad.", "70 °C en el centro, sin partes rosadas."], "nota": "Es el corte de cerdo económico que mejor rinde en comidas de olla para muchas personas."}, "desaconsejados": {"lista": ["Plancha rápida", "Parrilla directa sin preparación", "Cocción corta sin líquido"], "porque": ["El colágeno no se transforma.", "Las fibras se contraen y queda duro.", "No llega a ablandarse."], "error": "Venderlo para «algo rápido». Es el error más frecuente con este corte."}, "venta": {"frases": ["«Es un corte muy sabroso, ideal para guisos o comidas con tiempo.»", "«No es para hacer rápido, pero bien cocido queda excelente.»", "«Rinde mucho y tiene muy buen sabor.»", "«Calculá una hora y media, dos horas, con líquido.»"], "argumento": "Económico, rendidor y sabroso si se cocina bien. No es cómodo, pero vale la pena.", "alternativa": "Si el cliente necesita algo rápido, ofrecer carré o blando de cerdo."}, "ideas": [["Guiso de cerdo", "Cocción lenta con verduras y caldo. Rinde para muchos."], ["Estofado al vino", "Largo, con reducción de líquidos. Plato de domingo."], ["Cerdo al horno con salsa", "En fuente, cocción controlada con humedad."]], "errores": ["Decir que es tierno: error grave.", "No aclarar que necesita tiempo.", "Recomendarlo para plancha o parrilla directa.", "No explicar el uso del líquido en la cocción.", "Venderlo como «para todo»."], "tags": {"coccion": "lenta", "metodos": ["olla", "horno"], "perfiles": ["contiempo", "economico"]}, "tabla": {"coccion": "Lenta", "tern dor para simplificar la venta: el cliente pide blando de cerdo y el carnicero selecciona y corta una porción de la pierna según disponibilidad. No siempre es exactamente igual, pero mantiene un perfil común de comportamiento en cocina.", "semaforo": {"si": ["Milanesas", "Bifes finos a la plancha", "Horno con líquido o cobertura", "Salteados"], "criterio": ["Pieza grande al horno sin líquido: hay que estar encima del punto", "Carne rellena"], "no": ["Parrilla fuerte sin preparación", "Cocción prolongada sin líquido", "Tratarlo como corte graso"]}, "nombres": {"oficial": "No figura en la nomenclatura oficial. Se corresponde con el pernil o pierna de cerdo.", "mostrador": "Blando de cerdo.", "tambien": ["Pernil de cerdo", "Jamón fresco", "Pierna de cerdo"], "nota": "Es una denominación comercial, no un corte anatómico preciso. No confundirlo con paleta, bondiola o lomo."}, "ubicacion": {"texto": "Cuarto trasero del cerdo, específicamente de la pierna.", "implica": ["Músculos de trabajo: buena firmeza y estructura.", "Menor grasa que los cortes delanteros o del cuello.", "Fibras más marcadas que el lomo."], "clave": "Más magro que la bondiola, más estructurado que el carré y más rendidor que la mayoría de los cortes del cerdo."}, "datos": {"Terneza": "Media, puede variar según la parte", "Fibra": "Intermedia a marcada", "Grasa": "Baja", "Colágeno": "Bajo a medio", "Hueso": "No, en la versión deshuesada", "Rendimiento": "Muy alto"}, "comportamiento": {"bullets": ["Es relativamente magro: tiende a secarse si se pasa de cocción.", "No tiene la grasa que salva errores.", "Funciona bien si se controla el punto o si se cocina con humedad.", "En milanesa el rebozado compensa lo magro, igual que en los cortes magros de novillo."], "critico": "Es un corte rendidor y versátil, pero no indulgente. Hay que cuidarle la cocción."}, "recomendados": {"lista": ["Horno en piezas medianas o grandes, con líquido o cobertura", "Milanesas", "Bifes finos", "Salteados o plancha"], "claves": ["
