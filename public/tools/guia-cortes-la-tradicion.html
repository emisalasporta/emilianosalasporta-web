problema que venimos a resolver", "tipo": "texto", "texto": "Muchas veces se vende un corte sin entender su uso. Eso termina en malas experiencias: carne dura, preparaciones que no funcionan y clientes que no vuelven o que pierden confianza. El cliente casi nunca se enoja con el corte: se enoja con la carnicería.", "destacado": "Cuando un corte sale mal en la casa del cliente, el que queda mal no es el corte. Es el mostrador."}, {"num": "1.2", "titulo": "Para qué sirve", "tipo": "lista", "items": ["Para asesorar mejor al cliente.", "Para recomendar el corte correcto según el uso.", "Para evitar los errores típicos de sugerencia.", "Para dar seguridad al momento de vender.", "Para ampliar el conocimiento del equipo sobre los cortes.", "Para vender con criterio, no por costumbre."]}, {"num": "1.3", "titulo": "Cómo se usa en el mostrador", "tipo": "texto", "texto": "Es una herramienta de consulta, no un libro para leer de corrido. Sirve para entender qué corte funciona mejor con cada cocción, tener argumentos claros y simples al recomendar y evitar la frase que más caro sale: «llevá esto que es bueno para todo».", "destacado": "Escuchar primero → entender qué quiere hacer → recomendar en base a eso."}, {"num": "1.4", "titulo": "Qué esperamos que mejore", "tipo": "lista", "items": ["La calidad del asesoramiento.", "La confianza del cliente y su tasa de regreso.", "La seguridad del vendedor al recomendar.", "La rotación de los cortes menos demandados.", "La experiencia general de compra.", "La consistencia entre sucursales: que en las nueve se recomiende igual."]}]}, {"num": "2", "titulo": "Cómo leer esta guía", "intro": "Todos los cortes están desarrollados con el mismo formato. Si se entiende cómo leer una ficha, se entienden todas las demás.", "bloques": [{"num": "2.1", "titulo": "Las once partes de una ficha", "tipo": "definiciones", "items": [["En una frase", "El resumen del corte en una línea. Si solo tenés diez segundos, leé esto."], ["Semáforo de uso", "Verde, amarillo y rojo. Para qué sirve, para qué sirve con criterio y para qué no sirve."], ["Nombre y equivalencias", "Cómo se llama en el mostrador, cómo figura en el nomenclador oficial cuando figura, y con qué se lo suele confundir."], ["Ubicación en el animal", "De qué parte sale. Esto explica por qué es más tierno o más duro y qué cocción necesita."], ["Ficha técnica", "Terneza, fibra, grasa, colágeno, hueso y rendimiento. Los seis datos que definen cómo se comporta al calor."], ["Comportamiento en cocción", "Qué le pasa al corte cuando se lo cocina bien y qué le pasa cuando se lo cocina mal."], ["Métodos recomendados", "Las formas en las que el corte funciona, con las claves técnicas de cada una."], ["Métodos desaconsejados", "Qué NO hacer y por qué. Muchas veces es más importante que lo anterior."], ["Cómo venderlo", "Frases listas para usar en el mostrador y el argumento comercial fuerte del corte."], ["Tres ideas de preparación", "Aplicaciones concretas, simples, con ingredientes de almacén. No son recetas de chef."], ["Errores comunes al recomendarlo", "Las fallas típicas que generan reclamos."]]}, {"num": "2.2", "titulo": "El semáforo de uso", "tipo": "semaforo_leyenda", "texto": "Cada ficha abre con un semáforo. Es lo primero que hay que mirar cuando el cliente ya dijo qué quiere cocinar.", "leyenda": [["verde", "SÍ", "El corte rinde. Recomendalo sin advertencias."], ["ambar", "CON CRITERIO", "Funciona, pero explicá cómo. Si no se explica, falla."], ["rojo", "NO", "No lo recomiendes para eso. Ofrecé una alternativa."]]}, {"num": "2.3", "titulo": "Cómo usar cada ficha", "tipo": "lista_num", "texto": "La lógica es siempre la misma, y son cuatro pasos.", "items": ["Entender qué quiere hacer el cliente.", "Ubicar el corte adecuado.", "Ver rápidamente cómo se comporta al calor.", "Recomendar con criterio, diciendo también el límite."], "destacado": "No todos los cortes sirven para todo. Cada corte tiene su mejor uso. Si se entiende eso, mejora automáticamente la calidad de la venta."}]}, {"num": "3", "titulo": "Criterio técnico usado", "intro": "Esta guía se construye sobre criterios técnicos claros, para evitar errores al recomendar y para dar argumentos sólidos en el mostrador. El objetivo es simple: no inventar, no suponer y no confundir al cliente.", "bloques": [{"num": "3.1", "titulo": "Base de validación", "tipo": "definiciones", "items": [["Nomencladores técnicos argentinos", "La Resolución SENASA 1128/1999 y el Nomenclador de Cortes del IPCVA son la referencia principal para ubicar cada corte en el animal, entender su estructura y ordenar las equivalencias."], ["Bibliografía del sector cárnico", "Materiales técnicos y formativos del rubro, usados para validar características, usos recomendados y comportamiento en cocción."], ["Criterios culinarios según la estructura del corte", "La recomendación se basa en el tipo de fibra, la cantidad de tejido conectivo, el nivel de grasa y la presencia de hueso. Eso define qué método de cocción funciona y cuál no. No es cuestión de gusto."], ["Observación comercial de La Tradición", "Cuando el nombre del corte no es técnico o es ambiguo, manda el uso real del mostrador de La Tradición. La guía usa los nombres que efectivamente maneja el cliente en Catamarca."]]}, {"num": "3.2", "titulo": "Nombre oficial y nombre de mostrador", "tipo": "texto_tabla", "texto": "No todos los nombres de cortes son universales. Algunos son regionales, otros son comerciales y otros hacen referencia a una zona del animal más que a un corte exacto. Un mismo corte puede tener distintos nombres según el lugar, y un mismo nombre puede designar piezas distintas en dos provincias.\n\nDe los dieciséis cortes de esta guía, seis tienen entrada en el nomenclador oficial y diez son denominaciones comerciales o regionales. Eso no los hace menos válidos: son los nombres con los que se vende. Pero conviene tenerlo claro para no discutir con un cliente de otra provincia.", "tabla_titulo": "Cómo figura cada corte", "tabla_head": ["Corte (como se vende acá)", "Situación"], "tabla": [["Osobuco / puchero caracú", "Oficial — Garrón / Brazuelo, cód. 1014"], ["Falda", "Oficial — cód. 2316"], ["Aguja parrillera", "Oficial — Aguja, cód. 2306"], ["Cuadrada", "Oficial — Carnaza de cola o cuadrada, cód. 2467"], ["Bola de lomo", "Oficial — cód. 2462"], ["Tortuguita", "Nombre de mostrador (ver nota en la ficha)"], ["Picada especial", "Preparación de carnicería, no es un corte"], ["Espinazo / puchero de aguja", "Nombre de carnicería"], ["Tapa de asado", "Nombre de carnicería"], ["Bocado ancho y fino", "Nombre comercial, sin norma de despiece"], ["Blando de paleta", "Nombre comercial de La Tradición"], ["Dulce de espalda", "Nombre comercial regional"], ["Vacío, carré, bocado y blando de cerdo", "Solo el carré es nomenclatura reconocida"]], "destacado": "Mejor entender bien el corte y explicarlo simple, que repetir nombres sin saber qué se está vendiendo. Esta guía trabaja en el medio: traduce lo técnico a algo útil para vender mejor, sin perder precisión."}]}, {"num": "4", "titulo": "Principios prácticos de cocción", "intro": "No hace falta ser cocinero para vender bien carne. Pero sí hace falta entender por qué un corte funciona bien o mal según cómo se cocina. Si se domina esto, se deja de recomendar por costumbre y se empieza a recomendar con criterio.", "bloques": [{"num": "4.1", "titulo": "Las cinco variables que mandan", "tipo": "definiciones", "texto": "El método de cocción no es al azar: depende de cómo es el corte. Son cinco variables y siempre son las mismas.", "items": [["Terneza", "Cortes tiernos, cocción rápida. Cortes duros, cocción lenta. Si se hace rápido un corte duro, queda duro. Si se hace lento un corte tierno, pierde calidad."], ["Tejido conectivo (colágeno)", "Mucho colágeno pide tiempo y humedad. Poco colágeno responde bien a cocción rápida. El colágeno bien cocido se vuelve gelatinoso y mejora el resultado; mal cocido queda duro."], ["Grasa", "Aporta sabor y jugosidad. Los cortes con grasa toleran mejor las cocciones largas o intensas. Los cortes muy magros se secan más fácil: no tienen nada que compense el error."], ["Espesor", "Los cortes finos van a cocción rápida; los gruesos necesitan más control de temperatura. Un corte grueso mal manejado queda crudo adentro o seco afuera."], ["Hueso", "Con hueso: más sabor y cocción más lenta. Sin hueso: cocción más rápida y pareja. El hueso también ayuda a mantener la jugosidad."]], "destacado": "Duro, con colágeno y fibras marcadas → lento. Tierno y magro → rápido."}, {"num": "4.2", "titulo": "Los cuatro grupos de métodos", "tipo": "metodos", "texto": "Son las técnicas que transforman el alimento con calor. Conocer el grupo al que pertenece cada método evita la mitad de los errores de recomendación.", "grupos": [{"letra": "A", "titulo": "Calor seco", "desc": "El calor llega al alimento sin líquido de por medio. Genera costra exterior y color.", "metodos": ["Parrilla", "Plancha", "Sartén (salteado)", "Horno", "Gratinado", "Sellado"], "caracteristicas": ["Genera reacción de Maillard: color, aroma y costra.", "Alta temperatura.", "Los cortes tiernos funcionan mejor."], "nota": "Aclaración importante: el sellado no «encierra los jugos» adentro. Eso es un mito viejo. Lo que hace es formar la costra dorada, que es donde está buena parte del sabor. Vale por eso solo, no hace falta inventarle otra función."}, {"letra": "B", "titulo": "Medio graso", "desc": "Usa aceite o grasa para alcanzar temperaturas superiores a las del agua.", "metodos": ["Fritura", "Salteado", "Sofrito"], "caracteristicas": ["Dora rápido y aporta sabor.", "Es la base de la milanesa y del salteado en tiras."], "nota": ""}, {"letra": "C", "titulo": "Calor húmedo", "desc": "Se cocina con agua o caldo. Es el camino para ablandar texturas.", "metodos": ["Hervido", "Pochado", "Escalfado", "Vapor", "Blanqueado"], "caracteristicas": ["No genera costra.", "Conserva humedad.", "Ablanda tejidos: es la clave de los cortes duros."], "nota": ""}, {"letra": "D", "titulo": "Mixtos o combinados", "desc": "Combinan calor seco y húmedo: primero se sella, después se cocina largo con líquido.", "metodos": ["Braseado", "Estofado", "Guiso", "Horno con líquido"], "caracteristicas": ["Desarrollan sabor y ablandan al mismo tiempo.", "Son los ideales para los cortes con colágeno.", "Es donde brillan los cortes económicos."], "nota": ""}]}, {"num": "4.3", "titulo": "Clasificación práctica para venta", "tipo": "definiciones", "texto": "Para no complicarse en el mostrador, todos los cortes entran en uno de estos cuatro grupos.", "items": [["Cortes de cocción rápida", "Plancha, sartén, milanesa, salteado en tiras. Son tiernos, de poca fibra y bajo colágeno. Claves: poco tiempo, alta temperatura, no sobrecocinar. Ojo: cocción rápida no es sinónimo de parrilla —la mayoría de estos cortes son magros y en parrilla directa se secan."], ["Cortes de cocción intermedia", "Horno, parrilla media, bifes gruesos, braseado corto. Equilibran terneza y estructura. Claves: controlar temperatura, no apurar, buen manejo del punto."], ["Cortes de cocción lenta", "Puchero, guiso, estofado, horno largo, braseado. Más duros, con tejido conectivo y fibras marcadas. Claves: tiempo, temperatura moderada y presencia de líquido. Acá es donde más se equivoca la gente: quiere hacer rápido lo que necesita tiempo."], ["Cortes versátiles", "Se adaptan a más de un método según cómo se los corte o prepare. No son «para todo»: tienen más opciones, pero requieren criterio."]], "destacado": "Cuando recomendás bien la cocción, el cliente obtiene mejor resultado, vuelve y confía. En una carnicería eso vale más que cualquier oferta."}, {"num": "4.4", "titulo": "Punto de cocción y temperatura interna", "tipo": "texto_tabla", "texto": "El punto se define por la temperatura del centro de la pieza, no por el tiempo ni por el color de afuera. Un termómetro de cocina cuesta poco y resuelve la discusión. Este es el dato que más rápido convierte a un vendedor en asesor.", "tabla_titulo": "Vacuno · punto de cocción por temperatura interna", "tabla_head": ["Punto", "Temperatura interna", "Cómo queda"], "tabla": [["Vuelta y vuelta", "52 °C", "Rojo en el centro, apenas tibio"], ["Jugoso", "54–57 °C", "Rosado parejo, jugoso"], ["A punto", "60–63 °C", "Rosa pálido en el centro"], ["A punto pasado", "66 °C", "Casi sin rosado"], ["Bien cocido", "71 °C o más", "Cocido en todo el corte"]], "nota": "Retirar del fuego entre 3 y 8 °C antes del objetivo, según el tamaño de la pieza: durante el reposo la temperatura sigue subiendo. Esta tabla es de vacuno; en cerdo el mínimo sanitario es 70 °C y no se baja de ahí."}, {"num": "4.5", "titulo": "Inocuidad: lo que no se negocia", "tipo": "alerta", "texto": "Hay dos casos donde el punto de cocción no es una preferencia del cliente sino una cuestión de salud, y una advertencia sobre cómo se controla. Esto se dice siempre, aunque el cliente no pregunte.", "items": [["Cerdo — 70 °C en toda la pieza", "SENASA recomienda que la carne porcina alcance 70 °C en el interior y que no queden jugos ni color rosado al servirla. El motivo es la triquinosis, que en Argentina sigue siendo un riesgo real. Importante: la salazón, el ahumado, el congelado y el microondas NO matan al parásito. Solo la cocción. Vale tanto para cortes enteros como para picada y rellenos."], ["Carne picada — 71 °C, sin partes rosadas", "En un corte entero las bacterias están en la superficie y el calor las alcanza. En la picada quedan repartidas en toda la masa. Por eso la picada se cocina completa, sin centro rojo. Es la prevención del Síndrome Urémico Hemolítico, que afecta sobre todo a chicos."], ["El color engaña en los dos sentidos", "Hay carne que se ve cocida sin estarlo y carne que se ve cruda estando segura. «Que no quede rosado» es una buena regla de campo, pero lo único que confirma de verdad es el termómetro."]], "destacado": "Una hamburguesa jugosa en el punto rojo es una moda de hamburguesería, no una recomendación de carnicería. En el mostrador se recomienda picada bien cocida. Siempre."}, {"num": "4.6", "titulo": "El reposo", "tipo": "texto", "texto": "Después de cocinar hay que dejar descansar la carne antes de cortarla. Al enfriarse un poco, los jugos se espesan y quedan retenidos en el músculo en lugar de chorrear sobre la tabla.\n\nBifes y costeletas: de 5 a 10 minutos. Piezas grandes de horno o asados: de 15 a 20 minutos. El salto grande está en los primeros 10 minutos: ahí se recupera más de la mitad del jugo que se perdería cortando de una.", "destacado": "Es la mejora de resultado más barata que existe. No cuesta nada y no requiere técnica: es solo esperar."}]}, {"num": "5", "titulo": "Asesoramiento comercial en mostrador", "intro": "Vender carne no es despachar lo que el cliente pide. Es entender qué quiere hacer y ayudarlo a elegir bien. El valor del vendedor está en el criterio. El cliente puede no conocer los cortes, pero siempre sabe cuándo le recomendaron bien y cuándo le recomendaron mal.", "bloques": [{"num": "5.1", "titulo": "Las seis preguntas antes de recomendar", "tipo": "definiciones", "texto": "Antes de sugerir cualquier corte hay que entender el contexto. Estas seis preguntas ordenan la venta y evitan la mayoría de los errores.", "items": [["¿Para cuántas personas es?", "Define cantidad y también tipo de corte."], ["¿Qué querés cocinar?", "No es lo mismo un asado, un guiso o algo rápido."], ["¿Cómo lo vas a cocinar?", "Parrilla, horno, olla, disco, sartén. Cambia todo."], ["¿Querés algo tierno o algo rendidor?", "Muchas veces el cliente prioriza una cosa sobre la otra."], ["¿Tenés tiempo o necesitás algo rápido?", "Es la pregunta que más cambia la recomendación."], ["¿Buscás algo económico o priorizás resultado?", "Permite ajustar sin quedar fuera de presupuesto."]], "destacado": "Primero preguntar, después recomendar. El error típico es hacerlo al revés."}, {"num": "5.2", "titulo": "Árbol de decisión de mostrador", "tipo": "arbol", "texto": "La primera pregunta es siempre la misma: ¿tenés tiempo? Con esa respuesta, esto resuelve la recomendación en segundos.", "ramas": [{"pregunta": "¿Tiene tiempo?", "opciones": [{"si": "NO — necesita algo rápido", "luego": "¿Milanesa o plancha?", "salidas": [["Milanesa", "Cuadrada · Bola de lomo · Blando de paleta · Tortuguita"], ["Plancha o bifes finos", "Bola de lomo · Blando de paleta · Tortuguita · Carré de cerdo · Blando de cerdo"], ["Comida diaria mezclada", "Picada especial"]]}, {"si": "SÍ — tiene tiempo", "luego": "¿Olla o parrilla?", "salidas": [["Olla, guiso o puchero", "Osobuco · Bocado · Falda · Espinazo (de apoyo) · Bocado de cerdo"], ["Parrilla tranquila", "Aguja parrillera · Tapa de asado · Falda · Dulce de espalda · Vacío de cerdo"], ["Horno", "Tapa de asado · Bocado · Dulce de espalda · Carré de cerdo · Blando de cerdo"]]}]}], "destacado": "Si el cliente no sabe cómo lo va a cocinar, esa es la primera pregunta. Sin esa respuesta cualquier recomendación es una apuesta."}, {"num": "5.3", "titulo": "Las siete variables de venta", "tipo": "definiciones", "texto": "Cada recomendación se apoya en estas variables. El vendedor tiene que saber leerlas y usarlas.", "items": [["Terneza", "Qué tan blando es. Alta terneza: fácil de cocinar. Baja terneza: necesita técnica o tiempo."], ["Sabor", "Depende de la grasa, el hueso y el tipo de músculo. Con más grasa o hueso, más sabor."], ["Rendimiento", "Cuánto se aprovecha, descontando hueso, grasa y merma de cocción. Clave cuando el cliente quiere optimizar la compra."], ["Facilidad de cocción", "Algunos cortes se cocinan solos; otros requieren tiempo o técnica. Hay que decirlo."], ["Precio", "Siempre está en juego. El buen vendedor ofrece opciones dentro del presupuesto y alternativas con mejor relación precio–resultado."], ["Versatilidad", "Algunos sirven para una sola cosa; otros permiten varias preparaciones."], ["Presentación", "Cómo se ve el corte. Influye en la percepción de calidad y en la decisión de compra."]]}, {"num": "5.4", "titulo": "Cómo se arma una recomendación", "tipo": "texto", "texto": "El cliente no quiere una clase. Quiere una recomendación clara. Por eso cada corte tiene que poder explicarse en pocas palabras, y toda sugerencia debería tener tres partes: una frase de venta, una advertencia honesta y una indicación concreta de uso.", "destacado": "«Este corte no es el más tierno, pero para cocción lenta queda excelente y rinde mucho. Si lo hacés rápido te puede quedar duro: para horno o guiso funciona mejor que para plancha.»", "texto2": "Ese esquema —virtud, límite, uso— evita vender por inercia, evita recomendar mal, evita las malas experiencias y sostiene la credibilidad del mostrador.", "cierre": "El cliente no siempre sabe qué corte necesita. El vendedor sí debería saberlo. Ahí está la diferencia entre despachar carne y vender con criterio."}]}], "s8": {"num": "8", "titulo": "Consulta rápida de mostrador", "parte": "IV", "intro": "Esta parte está pensada para resolver en el momento, con el cliente enfrente. No reemplaza la ficha completa del corte: sirve para leer en diez o quince segundos y decidir bien.", "bloques": [{"num": "8.1", "titulo": "Cómo usar las tablas", "tipo": "lista_num", "items": ["Escuchar qué quiere hacer el cliente.", "Identificar el tipo de cocción.", "Buscar el corte en la tabla que corresponda.", "Ver si aplica, cómo recomendarlo y qué advertir."], "destacado": "Si dudás, no improvises: mirá la tabla."}, {"num": "8.2", "titulo": "Tabla resumen — cortes de novillo", "tipo": "tabla_resumen", "grupo": "novillo"}, {"num": "8.3", "titulo": "Tabla resumen — cortes de cerdo", "tipo": "tabla_resumen", "grupo": "cerdo"}, {"num": "8.4", "titulo": "Lectura rápida por tipo de cliente", "tipo": "perfiles", "texto": "Cuatro perfiles cubren la enorme mayoría de las ventas del mostrador. Identificado el perfil, la recomendación sale sola.", "perfiles": [{"id": "apurado", "titulo": "Cliente apurado", "sub": "Quiere resolver la comida de hoy y no tiene tiempo", "cortes": ["Cuadrada", "Bola de lomo", "Blando de paleta", "Tortuguita", "Picada especial", "Carré de cerdo", "Blando de cerdo"], "clave": "Advertirle siempre que no lo sobrecocine: son cortes con poca grasa y se secan. La picada especial, además, va bien cocida y sin rosado."}, {"id": "contiempo", "titulo": "Cliente con tiempo", "sub": "Va a hacer olla, guiso o puchero", "cortes": ["Osobuco", "Bocado", "Falda", "Espinazo (de apoyo)", "Bocado de cerdo"], "clave": "Decirle cuánto tiempo necesita, en horas. Si no se lo decís, lo apura y falla."}, {"id": "parrillero", "titulo": "Cliente parrillero, pero no premium", "sub": "Quiere asado sin gastar en cortes caros", "cortes": ["Aguja parrillera", "Dulce de espalda", "Tapa de asado", "Falda", "Vacío de cerdo"], "clave": "Fuego medio o bajo y no apurar. La falda, siempre fuego bajo."}, {"id": "economico", "titulo": "Cliente que mira el precio", "sub": "Necesita estirar el presupuesto sin comer mal", "cortes": ["Bocado", "Falda", "Aguja parrillera", "Picada especial", "Espinazo (como complemento)", "Blando de paleta", "Bocado de cerdo"], "clave": "Vender resultado, no precio. El corte barato mal cocinado sale caro."}]}, {"num": "8.5", "titulo": "Los seis errores que más caro salen", "tipo": "errores_top", "texto": "Estos son los errores que generan reclamos, pérdida de confianza y clientes que no vuelven. Si el equipo solo se lleva dos páginas de toda la guía, que sean estas.", "items": [["«Llevá esto que es bueno para todo»", "Ningún corte es bueno para todo. Esta frase es la que más malas experiencias genera. Reemplazarla por: «¿cómo lo vas a cocinar?»."], ["Vender un corte de cocción lenta sin decir cuánto tarda", "Osobuco, bocado, falda y bocado de cerdo necesitan horas. Si el cliente no lo sabe, apura la cocción, le queda duro y la culpa se la lleva la carnicería."], ["Decir «tiernísima» de un corte magro", "Cuadrada, bola de lomo, tortuguita y blando de cerdo son prolijos y rendidores, no blandos. Prometer terneza que no tienen es garantía de reclamo."], ["Mandar a la plancha lo que va a la olla", "Y al revés. Es el error técnico más caro: el cliente tira la comida y no vuelve."], ["No advertir el punto de cocción del cerdo", "El cerdo va a 70 °C, sin partes rosadas. Es salud, no gusto. Se dice siempre."], ["No estandarizar entre sucursales", "Si el bocado ancho, la picada especial o el blando de paleta salen distinto en cada sucursal, el nombre deja de significar algo y la recomendación deja de ser confiable."]]}]}, "glosario": [{"titulo": "Términos de la carne y su estructura", "num": "9.1", "items": [["Ablandar", "Proceso por el cual la carne se vuelve más tierna, por cocción, maduración o técnicas mecánicas."], ["Aguja", "Zona del cuarto delantero cercana al cuello, con cortes sabrosos y de terneza media a baja."], ["Bife", "Corte en porción plana, destinado a cocción rápida en plancha, sartén o parrilla."], ["Colágeno", "Proteína del tejido conectivo. Con cocción lenta y húmeda se transforma en gelatina y aporta terneza; mal cocido queda duro."], ["Corte económico", "Corte de menor precio que generalmente requiere más técnica o más tiempo de cocción."], ["Corte graso", "Corte con presencia de grasa que aporta sabor y tolera mejor los errores de cocción."], ["Corte magro", "Corte con bajo contenido de grasa, con tendencia a secarse si se sobrecocina."], ["Corte noble", "Término comercial para cortes de fácil cocción y buena terneza natural."], ["Desgrasar", "Retirar grasa del corte para modificar su presentación o su uso."], ["Desposte", "Proceso de separación del animal en cortes comerciales."], ["Dureza", "Resistencia de la carne al corte o a la masticación. Depende de la fibra y del colágeno."], ["Fibra", "Estructura del músculo. Cuanto más larga y marcada, mayor firmeza del corte."], ["Gelatinización", "Transformación del colágeno en gelatina. Empieza cerca de los 70 °C y se acelera por encima de los 80 °C: por eso necesita tiempo, no solo temperatura."], ["Grasa externa const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

const COCC={rapida:'Rápida',media:'Media',lenta:'Lenta'};
const MET={parrilla:'Parrilla',horno:'Horno',olla:'Olla / guiso',sarten:'Plancha / sartén',

let state={tab:'cortes',q:'',fg:'',fc:'',fm:''};

D.fichas.forEach(f=>{
  f._ix=norm([f.nombre,f.frase,f.resumen,f.nombres.mostrador,f.nombres.oficial,
   (f.nombres.tambien||[]).join(' '),f.tabla.para,f.tabla.frase,
   f.semaforo.si.join(' '),f.semaforo.criterio.join(' '),
   f.recomendados.lista.join(' '),f.ideas.map(i=>i[0]).join(' ')].join(' '));
});

/* ── helpers de render ── */
const ul=a=>'<ul class="dot">'+a.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';
const call=(t,c)=>`<div class="callout ${c||''}">${esc(t)}</div>`;
const acc=(t,body,open)=>`<div class="acc${open?' open':''}"><button onclick="this.parentNode.classList.toggle('open')">
  <span class="n">${esc(t)}</span><span class="ar">&#10095;</span></button><div class="bd">${body}</div></div>`;
const tabla=(head,rows,dark)=>`<div class="tw"><table class="${dark?'dark':''}"><thead><tr>`+
  head.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr></thead><tbody>'+
  rows.map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';

/* ── tarjetas ── */
function cardHTML(f){
  const t=[`<span class="c-${f.tags.coccion}">${COCC[f.tags.coccion]}</span>`]
    .concat(f.tags.metodos.slice(0,2).map(m=>`<span>${MET[m]}</span>`));
  return `<button class="card" onclick="openFicha('${f.slug}')">
    <img src="${f.img}" alt="${esc(f.nombre)}" loading="lazy">
    <div class="b"><h3>${esc(f.nombre)}</h3><p>${esc(f.frase)}</p>
    <div class="tg">${t.join('')}</div></div></button>`;
}
function filtered(){
  const q=norm(state.q);
  return D.fichas.filter(f=>
    (!state.fg||f.grupo===state.fg)&&
    (!state.fc||f.tags.coccion===state.fc)&&
    (!state.fm||f.tags.metodos.includes(state.fm))&&
    (!q||f._ix.includes(q)));
}
function renderCortes(){
  const fs=filtered();
  $('#cards').innerHTML = fs.length? fs.map(cardHTML).join('')
    : '<div class="empty">No hay cortes con esos filtros.<br>Probá con otra palabra o limpiá los filtros.</div>';
  $('#count').textContent = fs.length+(fs.length===1?' corte':' cortes');
}

  const html=`
  <div class="dbar"><button class="back" onclick="closeFicha()">&#10094;</button>
    <b>${esc(f.nombre)}</b>
    <span class="tg"><span class="c-${f.tags.coccion}">${COCC[f.tags.coccion]}</span></span></div>

  const d=$('#detail'); d.innerHTML=html; d.scrollTop=0; d.classList.add('open');

function closeFicha(){
  $('#detail').classList.remove('open'); document.body.style.overflow='';

window.addEventListener('popstate',()=>{ if($('#detail').classList.contains('open')) closeFicha(); });

  let h=`<h2 class="sc">¿Qué le recomiendo?</h2>
  <div class="sub">Árbol de decisión de mostrador</div>
  <p class="mini" style="margin-bottom:12px">Primero preguntá, después recomendá. Empezá por acá.</p>
  <div class="qbtns">
    <button class="qbtn${dec.tiempo==='no'?' on':''}" onclick="setDec('tiempo','no')">
      <b>No tiene tiempo</b><span>Quiere resolver la comida de hoy</span></button>
    <button class="qbtn${dec.tiempo==='si'?' on':''}" onclick="setDec('tiempo','si')">
      <b>Sí tiene tiempo</b><span>Puede dejarlo horas en la olla o en la parrilla</span></button>
  </div>`;
  if(dec.tiempo){
    const a=ARBOL[dec.tiempo];
    h+=`<div class="sub">${esc(a.t)} · ¿cómo lo va a cocinar?</div><div class="res-list">`
      + a.op.map(([k,val])=>`<div class="perfil"><h4>${esc(k)}</h4>
         <div style="margin-top:7px">${val.split(' · ').map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>
         </div>`).join('') + '</div>';
  }
  h+=`<h2 class="sc">Por tipo de cliente</h2><div class="sub">Cuatro perfiles cubren casi toda la venta</div>`;
  const perf=s8.bloques.find(b=>b.tipo==='perfiles');
  h+=perf.perfiles.map(p=>`<div class="perfil"><h4>${esc(p.titulo)}</h4><div class="s">${esc(p.sub)}</div>
    <div>${p.cortes.map(c=>`<span class="pill">${esc(c)}</span>`).join('')}</div>
    <div class="cl">${esc(p.clave)}</div></div>`).join('');
  const et=s8.bloques.find(b=>b.tipo==='errores_top');
  h+=`<h2 class="sc">${esc(et.titulo.replace('8.5 ',''))}</h2><div class="sub">Si te llevás una sola página, que sea esta</div>`;
  h+=et.items.map((it,i)=>`<div class="errbox"><div class="n">${String(i+1).padStart(2,'0')}</div>
    <div><h4>${esc(it[0])}</h4><p>${esc(it[1])}</p></div></div>`).join('');
  h+=`<h2 class="sc">Tablas de consulta</h2><div class="sub">Novillo</div>`;
  const head=['Corte','Cocción','Terneza','Para qué usar','Evitar','Frase de venta'];
  h+=tabla(head, D.fichas.filter(f=>f.grupo==='novillo').map(f=>
     [f.nombre,f.tabla.coccion,f.tabla.terneza,f.tabla.para,f.tabla.evitar,f.tabla.frase]));
  h+=`<div class="sub">Cerdo</div>`;
  h+=tabla(head, D.fichas.filter(f=>f.grupo==='cerdo').map(f=>
     [f.nombre,f.tabla.coccion,f.tabla.terneza,f.tabla.para,f.tabla.evitar,f.tabla.frase]));
  $('#tab-decidir').innerHTML=h;
}
function setDec(k,v){ dec[k]=(dec[k]===v?null:v); renderDecidir(); }

/* ── fundamentos ── */
function bloqueHTML(b){
  let h='';
  if(b.texto) h+=b.texto.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('');
  if(b.tipo==='lista') h+=ul(b.items);
  if(b.tipo==='lista_num') h+='<ol>'+b.items.map(i=>`<li>${esc(i)}</li>`).join('')+'</ol>';
  if(b.tipo==='definiciones'||b.tipo==='alerta')
    h+=b.items.map(([k,v])=>`<p class="mini"><b>${esc(k)}.</b> ${esc(v)}</p>`).join('');
  if(b.tipo==='semaforo_leyenda')
    h+='<div class="sem">'+b.leyenda.map(([c,l,d])=>
      `<div class="c ${c}"><div class="h">${esc(l)}</div><div style="padding:9px 12px;font-size:13.5px;color:var(--piedra)">${esc(d)}</div></div>`).join('')+'</div>';
  if(b.tipo==='metodos')
    h+=b.grupos.map(g=>`<div class="perfil"><h4>${esc(g.letra)}. ${esc(g.titulo)}</h4>
      <div class="s">${esc(g.desc)}</div>
      <div>${g.metodos.map(m=>`<span class="pill">${esc(m)}</span>`).join('')}</div>
      ${ul(g.caracteristicas)}${g.nota?call(g.nota,'gold'):''}</div>`).join('');
  if(b.tipo==='texto_tabla'){ h+=tabla(b.tabla_head,b.tabla,true); if(b.nota) h+=call(b.nota,'gold'); }
  if(b.tipo==='arbol') h+=call('Primera pregunta: '+b.ramas[0].pregunta,'quote')+b.ramas[0].opciones.map(o=>`<div class="perfil"><h4>${esc(o.si)}</h4>
      <div class="s">${esc(o.luego)}</div>`+o.salidas.map(([k,v])=>
      `<p class="mini"><b>${esc(k)}.</b> ${esc(v)}</p>`).join('')+'</div>').join('');
  if(b.texto2) h+=`<p>${esc(b.texto2)}</p>`;
  if(b.destacado) h+=call(b.destacado,'quote');
  if(b.cierre) h+=call(b.cierre,'quote');
  return h;
}
function renderFund(){
  let h='<h2 class="sc">Fundamentos</h2><div class="sub">Cómo se usa la guía · cocción · venta</div>';
  D.fund.forEach(S=>{
    h+=`<h2 class="sc">${esc(S.num)}. ${esc(S.titulo)}</h2>`;
    if(S.intro) h+=`<p class="mini" style="margin-bottom:12px">${esc(S.intro)}</p>`;
    S.bloques.forEach(b=>{ h+=acc(b.num+'  '+b.titulo, bloqueHTML(b)); });
  });
  h+=`<div class="foot"><b>${esc(D.cierre.firma)}</b>${esc(D.meta.edicion)}</div>`;
  $('#tab-fund').innerHTML=h;
}

/* ── glosario ── */
function renderGlos(){
  const q=norm($('#gq')?$('#gq').value:'');
  let h='';
  D.glosario.forEach(g=>{
    const items=g.items.filter(([k,v])=>!q||norm(k+' '+v).includes(q));
    if(!items.length) return;
    h+=`<h2 class="sc" style="font-size:19px">${esc(g.titulo)}</h2>`;
    h+=items.map(([k,v])=>`<div class="gitem"><b>${esc(k)}.</b> <span>${esc(v)}</span></div>`).join('');
  });
  $('#glist').innerHTML = h || '<div class="empty">Sin resultados.</div>';
}

/* ── tabs ── */
function go(t){
  state.tab=t;
  $$('.tabpane').forEach(p=>p.style.display='none');
  $('#tab-'+t).style.display='';
  $$('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  window.scrollTo(0,0);
  if(t==='decidir')renderDecidir(); if(t==='fund')renderFund(); if(t==='glos')renderGlos();
}

/* ── init ── */
function init(){
  // chips
  const cg=$('#chips');
  const mk=(cls,lab,fn,act)=>{const b=document.createElement('button');
    b.className='chip '+cls+(act?' on':'');b.textContent=lab;b.onclick=fn;return b;};
  function paintChips(){
    cg.innerHTML='';
    cg.appendChild(mk('',(state.fg||state.fc||state.fm)?'Limpiar filtros':'Todos',()=>{
      state.fg=state.fc=state.fm='';paintChips();renderCortes();},!(state.fg||state.fc||state.fm)));
    [['novillo','Novillo'],['cerdo','Cerdo']].forEach(([k,l])=>
      cg.appendChild(mk('g-'+k,l,()=>{state.fg=state.fg===k?'':k;paintChips();renderCortes();},state.fg===k)));
    Object.entries(COCC).forEach(([k,l])=>
      cg.appendChild(mk('',l,()=>{state.fc=state.fc===k?'':k;paintChips();renderCortes();},state.fc===k)));
    Object.entries(MET).forEach(([k,l])=>
      cg.appendChild(mk('',l,()=>{state.fm=state.fm===k?'':k;paintChips();renderCortes();},state.fm===k)));
  }
  paintChips();
  const inp=$('#q');
  inp.oninput=()=>{state.q=inp.value;$('.search').classList.toggle('has',!!inp.value);renderCortes();};
  $('#qclear').onclick=()=>{inp.value='';state.q='';$('.search').classList.remove('has');renderCortes();inp.focus();};
  renderCortes();
  $$('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  if(location.hash){ const s=location.hash.slice(1); if(D.fichas.some(f=>f.slug===s)) openFicha(s); }
}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
