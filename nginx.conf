# ============================================================
#  Cómo se sirve la web ya construida.
#  Traefik (de Dokploy) maneja el dominio y el certificado HTTPS por afuera:
#  acá adentro alcanza con escuchar en el puerto 80.
# ============================================================

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---------- URLs limpias ----------
  # /blog/mi-nota  ->  /blog/mi-nota/index.html
  # OJO: NADA de mandar todo a index.html como respaldo. Eso se hace en las apps
  # de una sola página; acá cada página es un archivo real. Si algo no existe
  # tiene que dar 404 de verdad, no la home disfrazada (Google penaliza eso).
  location / {
    try_files $uri $uri/ $uri.html $uri/index.html =404;

    # ---------- La pantalla en blanco del iPhone ----------
    # Sintoma: en el celular, tocar en el menu una pagina en la que YA estabas
    # daba pantalla en blanco y ofrecia bajar un "document.txt". Y alternaba:
    # una vez andaba, la siguiente no.
    #
    # Por que: el HTML se sirve con "max-age=0, must-revalidate", asi que el
    # navegador revalida en CADA navegacion. nginx le contesta 304 Not Modified,
    # que es una respuesta sin cuerpo: el navegador tiene que poner la pagina de
    # su propia cache. WebKit (el motor de Safari, y tambien el de Chrome en
    # iPhone: en iOS todos los navegadores usan WebKit por obligacion) a veces
    # recupera el cuerpo pero pierde el Content-Type. Se queda con 7762 bytes de
    # HTML que ya no sabe que son HTML -> pantalla en blanco y "descargate esto".
    # El alternado es el mismo bug: al fallar invalida la cache, la proxima pide
    # un 200 completo y anda, y ahi vuelve a cachear para romperse de nuevo.
    #
    # La cura es no darle nunca un 304 a un documento HTML. Sin ETag y sin
    # atender el If-Modified-Since, nginx responde siempre 200 con el cuerpo
    # entero. Son paginas de 8 a 30 KB que ya viajaban en cada visita igual
    # (max-age=0), asi que no cambia nada el trafico: cambia que llegan enteras.
    # Los archivos con cache larga (/_astro/, fuentes, imagenes) NO estan
    # afectados: siguen con su ETag y su 304, que ahi funciona bien.
    etag off;
    if_modified_since off;
  }

  # Nuestra página de 404, en vez de la pantalla gris de nginx.
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # ---------- Caché ----------
  # Todo lo que vive en /_astro/ lleva un hash en el nombre: si el contenido
  # cambia, cambia el nombre. Por eso se puede cachear para siempre sin miedo.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Las fuentes tampoco cambian nunca.
  location ~* \.(woff2?|ttf|otf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Las calculadoras y las imágenes SÍ pueden cambiar (Emiliano sube una nueva
  # versión y el nombre del archivo es el mismo). Caché corta: que se actualicen
  # solas en un día sin que nadie tenga que limpiar nada.
  location ~* \.(png|jpe?g|webp|svg|ico|pdf|csv|xlsx?)$ {
    expires 1d;
    add_header Cache-Control "public, must-revalidate";
    access_log off;
  }

  # Las calculadoras son la excepcion: son archivos HTML pesados (100-200 KB de
  # una sola pieza) que cambian muy de vez en cuando. Con la regla de abajo se
  # bajaban ENTERAS en cada visita, y en el celular eso se siente. La pagina de
  # la herramienta las pide con ?v=<hash del archivo>: si el contenido cambia,
  # cambia la URL y el navegador la vuelve a bajar sola. Por eso se pueden
  # cachear tranquilos.
  # (Los add_header se repiten a proposito: nginx no hereda los de arriba en
  # cuanto un bloque define uno propio.)
  location ~* ^/tools/.*\.html$ {
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    access_log off;
  }

  # El HTML nunca se cachea fuerte: si publica una nota, tiene que aparecer ya.
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Mismo motivo que en `location /`: nada de 304 para documentos HTML.
    etag off;
    if_modified_since off;
  }

  # ---------- Compresión ----------
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css text/xml
    application/javascript application/json application/xml
    image/svg+xml;
  # Ojo: los woff2 ya vienen comprimidos, gzipearlos solo gasta CPU.

  # ---------- Seguridad básica ----------
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Que no se anuncie la versión de nginx.
  server_tokens off;
}
